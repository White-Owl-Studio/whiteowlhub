// ── zone 3: fourth-wall events ─────────────────────────────────────────────────
function initZ3Events(){
  z3ev={
    cursor:{phase:'idle',timer:0,x:-60,y:H/2,target:null},
    fakeGO:{phase:'idle',timer:0},
    typing:{phase:'idle',timer:0,idx:0},
    loading:{phase:'idle',timer:0},
  };
  z3LastWave=0;hudHpReversed=false;hudHpRevTimer=0;
  screenFlipped=false;screenFlipTimer=0;
}

function fireZ3Event(wave){
  if(!z3ev)return;
  if(wave===1){
    // Cursor kill — pick a live enemy as target
    const target=enemies.find(e=>!e.dead)||null;
    z3ev.cursor.phase='moving';z3ev.cursor.timer=0;
    z3ev.cursor.x=-60;
    z3ev.cursor.y=target?target.y-20:H*0.35;
    z3ev.cursor.target=target;
  } else if(wave===2){
    // HP backwards
    hudHpReversed=true;hudHpRevTimer=300;
  } else if(wave===3){
    // Fake game-over
    z3ev.fakeGO.phase='showing';z3ev.fakeGO.timer=0;
  } else if(wave===4){
    // L A I L A types on screen
    z3ev.typing.phase='typing';z3ev.typing.timer=0;z3ev.typing.idx=0;
  } else if(wave===5){
    // Loading bar
    z3ev.loading.phase='showing';z3ev.loading.timer=0;
  }
}

function updateZ3Events(){
  if(!z3ev||currentZone!==3)return;
  // Trigger event when a new wave begins
  if(zoneWave>z3LastWave&&enemies.length>0){z3LastWave=zoneWave;fireZ3Event(zoneWave);}
  // Cursor
  const cur=z3ev.cursor;
  if(cur.phase==='moving'){
    cur.timer++;cur.x+=3.5;
    const tx=cur.target&&!cur.target.dead?cur.target.x:W*0.6;
    if(cur.x>=tx-20){cur.phase='clicking';cur.timer=0;}
    if(cur.x>W+50)cur.phase='idle';
  } else if(cur.phase==='clicking'){
    cur.timer++;
    if(cur.timer===10&&cur.target&&!cur.target.dead){
      burst(cur.target.x,cur.target.y,'#ffffff',18,5);
      score+=cur.target.score;cur.target.dead=true;
    }
    if(cur.timer>35){cur.phase='fading';cur.timer=0;}
  } else if(cur.phase==='fading'){cur.timer++;if(cur.timer>45)cur.phase='idle';}
  // HP reversed timer
  if(hudHpRevTimer>0){hudHpRevTimer--;if(!hudHpRevTimer)hudHpReversed=false;}
  // Fake game-over
  const fgo=z3ev.fakeGO;
  if(fgo.phase==='showing'){fgo.timer++;if(fgo.timer>140){fgo.phase='glitching';fgo.timer=0;}}
  else if(fgo.phase==='glitching'){fgo.timer++;if(fgo.timer>55)fgo.phase='idle';}
  // Typing
  const typ=z3ev.typing;
  if(typ.phase==='typing'){typ.timer++;if(typ.timer%16===0&&typ.idx<5)typ.idx++;if(typ.idx>=5){typ.phase='fading';typ.timer=0;}}
  else if(typ.phase==='fading'){typ.timer++;if(typ.timer>55)typ.phase='idle';}
  // Loading bar
  const ld=z3ev.loading;
  if(ld.phase==='showing'){ld.timer++;if(ld.timer>240){ld.phase='fading';ld.timer=0;}}
  else if(ld.phase==='fading'){ld.timer++;if(ld.timer>45)ld.phase='idle';}
  // Screen flip timer
  if(screenFlipTimer>0){screenFlipTimer--;if(!screenFlipTimer)screenFlipped=false;}
}

function drawZ3Events(){
  if(!z3ev||currentZone!==3)return;
  // Cursor
  const cur=z3ev.cursor;
  if(cur.phase!=='idle'){
    const fa=cur.phase==='fading'?1-cur.timer/45:1;
    ctx.save();ctx.globalAlpha=fa*0.9;
    // Arrow cursor shape
    ctx.fillStyle='#ffffff';ctx.strokeStyle='#000';ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(cur.x,cur.y);ctx.lineTo(cur.x,cur.y+18);ctx.lineTo(cur.x+4,cur.y+13);
    ctx.lineTo(cur.x+9,cur.y+20);ctx.lineTo(cur.x+12,cur.y+18);
    ctx.lineTo(cur.x+7,cur.y+11);ctx.lineTo(cur.x+14,cur.y+11);
    ctx.closePath();ctx.fill();ctx.stroke();
    // Click flash
    if(cur.phase==='clicking'&&cur.timer<14){
      ctx.globalAlpha=(1-cur.timer/14)*0.55;ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(cur.x+2,cur.y+2,16,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  // Fake game-over
  const fgo=z3ev.fakeGO;
  if(fgo.phase==='showing'||fgo.phase==='glitching'){
    const fa=fgo.phase==='glitching'?Math.max(0,1-fgo.timer/55):1;
    ctx.save();ctx.globalAlpha=fa*0.92;
    if(fgo.phase==='glitching')ctx.filter=`blur(${Math.min(6,fgo.timer/8)}px)`;
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    glow('#880022',28);ctx.fillStyle='#cc1133';ctx.font='bold 44px monospace';
    ctx.fillText('THE ABYSS',W/2,H/2-64);ctx.fillText('CLAIMS YOU',W/2,H/2-14);
    noGlow();ctx.fillStyle='#ddc0ff';ctx.font='bold 22px monospace';
    ctx.fillText(`Souls: ${score}`,W/2,H/2+38);
    ctx.fillStyle='#664488';ctx.font='14px monospace';
    ctx.fillText('PRESS ENTER TO FALL AGAIN',W/2,H/2+74);
    if(fgo.phase==='glitching'){ctx.globalAlpha=0.1;ctx.fillStyle='#00ccff';ctx.fillRect(0,H/2-10+Math.random()*8,W,3);}
    ctx.filter='none';ctx.restore();
  }
  // L A I L A typing
  const typ=z3ev.typing;
  if(typ.phase==='typing'||typ.phase==='fading'){
    const letters=['L','A','I','L','A'];
    const fa=typ.phase==='fading'?Math.max(0,1-typ.timer/55):1;
    ctx.save();ctx.globalAlpha=fa*0.72;
    glow('#ffffff',18);ctx.fillStyle='#ffffff';ctx.font='bold 48px monospace';ctx.textAlign='center';
    const shown=letters.slice(0,typ.idx).join('  ');
    const cursor2=typ.phase==='typing'&&typ.idx<5&&frameCount%18<9?'_':'';
    ctx.fillText(shown+cursor2,W/2,H/2+10);noGlow();ctx.restore();
  }
  // Loading bar
  const ld=z3ev.loading;
  if(ld.phase==='showing'||ld.phase==='fading'){
    const fa=ld.phase==='fading'?Math.max(0,1-ld.timer/45):Math.min(1,ld.timer/20);
    ctx.save();ctx.globalAlpha=fa*0.82;
    ctx.fillStyle='#000';ctx.strokeStyle='#333';ctx.lineWidth=1;
    ctx.fillRect(12,H-40,210,24);ctx.strokeRect(12,H-40,210,24);
    glow('#00cc44',6);ctx.fillStyle='#00cc44';ctx.fillRect(14,H-38,70,20);
    noGlow();ctx.fillStyle='#cccccc';ctx.font='11px monospace';ctx.textAlign='left';
    ctx.fillText('LOADING REALITY...  34%',17,H-24);
    ctx.restore();
  }
}

// ── background draw functions ──────────────────────────────────────────────────
function drawBackground(){
  if(currentZone===1)drawBg_stillWater();
  else if(currentZone===2)drawBg_hunger();
  else if(currentZone===3)drawBg_betweenChannels();
  else drawBg_binding();
}

function drawBg_stillWater(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#060c16');g.addColorStop(0.5,'#050a14');g.addColorStop(1,'#020408');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Cold light from above — radial gradient (atmospheric glow, stays as gradient)
  const ls=Math.max(0.04,0.28-zoneWave*0.08);
  const lg=ctx.createRadialGradient(W/2,-10,0,W/2,-10,300);
  lg.addColorStop(0,`rgba(184,212,240,${ls})`);lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lg;ctx.fillRect(0,0,W,H*0.6);
  // Sediment (upward)
  zoneParticles.forEach(p=>{ctx.globalAlpha=p.a;ctx.fillStyle='#8ab0cc';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  // BgElements
  bgElements.forEach(el=>{
    if(el.type==='stick'){
      ctx.save();ctx.globalAlpha=el.opacity;ctx.strokeStyle='#2a1a0a';ctx.lineWidth=1.2;ctx.lineCap='round';
      ctx.translate(el.x,el.y);ctx.rotate(el.angle);
      ctx.beginPath();ctx.moveTo(-el.len/2,0);ctx.lineTo(el.len/2,0);ctx.stroke();
      if(el.len>20){ctx.beginPath();ctx.moveTo(-el.len*0.15,0);ctx.lineTo(-el.len*0.05,-el.len*0.28);ctx.stroke();}
      ctx.restore();
    } else if(el.type==='frog'&&el.active){
      ctx.save();ctx.globalAlpha=0.12;ctx.fillStyle='#1a2a0a';
      ctx.beginPath();ctx.ellipse(el.x,el.y,22,14,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#1a2a0a';ctx.lineWidth=2;
      [[-18,8],[-10,16],[10,16],[18,8]].forEach(([lx,ly])=>{ctx.beginPath();ctx.moveTo(el.x+lx*0.4,el.y+4);ctx.lineTo(el.x+lx,el.y+ly);ctx.stroke();});
      ctx.restore();
    }
  });
}

function drawBg_hunger(){
  const redness=Math.min(1,(zoneWave-1)/4);
  const r1=Math.floor(13+redness*30);
  ctx.fillStyle=`rgb(${r1},10,${Math.floor(26-redness*16)})`;ctx.fillRect(0,0,W,H);
  // Breathing pulse — stronger, cell-shaded strips
  const pulse=Math.sin(frameCount*0.018);
  ctx.fillStyle=`rgba(40,0,12,${0.10+pulse*0.06})`;ctx.fillRect(0,0,W,H);
  if(pulse>0.6){ctx.fillStyle='rgba(60,0,8,0.05)';ctx.fillRect(0,H*0.3,W,H*0.4);}
  // Embers — warmer color on close particles, cooler on far ones
  zoneParticles.forEach(p=>{
    if(p.kind!=='ember')return;
    const hue=Math.floor((p.warm||0)*22); // red→orange based on warmth
    const lit=Math.floor(16+p.r*5);       // brighter = closer
    ctx.globalAlpha=p.a;
    ctx.fillStyle=`hsl(${hue},78%,${lit}%)`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  // Face flashes + reflections
  bgElements.forEach(el=>{
    if(el.type==='face'&&el.opacity>0){
      ctx.save();ctx.globalAlpha=el.opacity;ctx.strokeStyle='#443344';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(el.x-8,el.y-5,3,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(el.x+8,el.y-5,3,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(el.x,el.y+8,6,0,Math.PI);ctx.stroke();
      ctx.restore();
    } else if(el.type==='reflection'&&el.active&&el.opacity>0){
      // Background atmospheric silhouette — Laila reflected, not matching her movements
      drawLailaVariant(el.x, el.y, {
        floatOff: el.x*0.006 + 1.2,
        mirror:   true,
        alpha:    el.opacity*0.32,
        hairCol:  '#1a1428',

          ([1,2,3,7,8,9].includes(i)) ? [px, py-5] : [px,py]

    }
  });
}

function drawBg_betweenChannels(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // Ever-zooming Mandelbrot — rendered at low res and scaled up for pixel glitch aesthetic
  if(!window._mbc){window._mbc=document.createElement('canvas');window._mbc.width=160;window._mbc.height=120;}
  if(frameCount%2===0){
    const mW=160,mH=120,mctx=window._mbc.getContext('2d');
    const img=mctx.createImageData(mW,mH);
    const zoom=Math.pow(1.0015,frameCount%4000);
    const range=3.5/zoom;
    const rcx=-0.7435669,rcy=0.1314023;
    const x0=rcx-range/2,y0=rcy-range*(mH/mW)*0.5;
    const dx=range/mW,dy=range*(mH/mW)/mH;
    const maxI=80;
    const pal=[[255,102,0],[204,0,255],[255,255,0],[255,0,153],[0,204,255],[255,0,0],[0,255,0],[255,255,255]];
    for(let py=0;py<mH;py++){
      for(let px=0;px<mW;px++){
        let zr=0,zi=0,it=0;
        const cr=x0+px*dx,ci=y0+py*dy;
        while(it<maxI&&zr*zr+zi*zi<4){const tmp=zr*zr-zi*zi+cr;zi=2*zr*zi+ci;zr=tmp;it++;}
        const off=(py*mW+px)*4;
        if(it===maxI){img.data[off+3]=255;}
        else{
          const c=pal[Math.floor(it*pal.length/maxI)%pal.length];
          const b=0.4+0.6*it/maxI;
          img.data[off]=c[0]*b;img.data[off+1]=c[1]*b;img.data[off+2]=c[2]*b;img.data[off+3]=255;
        }
      }
    }
    mctx.putImageData(img,0,0);
  }
  ctx.imageSmoothingEnabled=false;ctx.globalAlpha=0.88;
  ctx.drawImage(window._mbc,0,0,W,H);
  ctx.imageSmoothingEnabled=true;ctx.globalAlpha=1;

  // Neon grid glitch lines
  if(frameCount%7===0){
    const gcols=['#ff6600','#cc00ff','#00ccff','#ff0099'];
    ctx.save();ctx.globalAlpha=0.12;ctx.strokeStyle=gcols[Math.floor(frameCount/7)%gcols.length];ctx.lineWidth=1;
    const gy=Math.random()*H;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
    ctx.restore();
  }

  // CRT scan lines
  ctx.fillStyle='rgba(0,0,0,0.22)';
  for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);

  // Geometry flashes from kills
  zoneParticles.forEach(p=>{
    if(p.kind==='geoflash'&&p.life>0){
      ctx.save();ctx.globalAlpha=p.life*0.55;ctx.strokeStyle=p.col;ctx.lineWidth=2;
      if(p.shape==='triangle'){ctx.beginPath();ctx.moveTo(p.x,p.y-p.r);ctx.lineTo(p.x+p.r*0.87,p.y+p.r*0.5);ctx.lineTo(p.x-p.r*0.87,p.y+p.r*0.5);ctx.closePath();ctx.stroke();}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();}
      ctx.restore();
    }
  });

  // Neon static — tiny flicker particles
  zoneParticles.forEach(p=>{
    if(p.kind!=='neonstat')return;
    const flicker=0.5+0.5*Math.sin(frameCount*0.09+p.phase);
    ctx.globalAlpha=p.a*flicker;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Chromatic edge aberration
  ctx.save();ctx.globalAlpha=0.06;
  ctx.fillStyle='#ff0000';ctx.fillRect(0,0,3,H);ctx.fillRect(W-3,0,3,H);
  ctx.fillStyle='#0000ff';ctx.fillRect(2,0,2,H);ctx.fillRect(W-5,0,2,H);
  ctx.restore();
}

function drawBg_binding(){
  ctx.fillStyle='#03020a';ctx.fillRect(0,0,W,H);
  // Laila aura — radial gradient light source (auras stay as gradients)
  if(player){
    const ar=90+projectileLevel*45, aStr=0.22+projectileLevel*0.08;
    const ag=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,ar);
    ag.addColorStop(0,`rgba(0,255,140,${aStr})`);
    ag.addColorStop(0.4,`rgba(0,204,102,${aStr*0.5})`);
    ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag;ctx.fillRect(0,0,W,H);
  }
  // Shadow boss silhouette in deep bg
  const prog=Math.min(1,zoneWave/ZONE_WAVE_COUNTS[4]);
  if(!boss){
    ctx.save();ctx.globalAlpha=0.04+prog*0.14;ctx.fillStyle='#000';
    const sx=W/2,sy=H*0.84+(1-prog)*30;
    ctx.beginPath();ctx.ellipse(sx,sy,28,42,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx,sy-50,18,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(sx-18,sy-8);ctx.bezierCurveTo(sx-65,-28+sy,sx-85,sy+18,sx-52,sy+32);ctx.fill();
    ctx.beginPath();ctx.moveTo(sx+18,sy-8);ctx.bezierCurveTo(sx+65,-28+sy,sx+85,sy+18,sx+52,sy+32);ctx.fill();
    ctx.restore();
  }
  // Void dust — depth-layered: larger/brighter particles closer
  zoneParticles.forEach(p=>{
    if(p.kind!=='void')return;
    ctx.globalAlpha=p.a;
    // Larger particles get a hint of purple from Laila's aura
    const purpleLift=Math.min(0.4,p.r*0.15);
    ctx.fillStyle=`rgb(${Math.floor(18+purpleLift*20)},${Math.floor(14+purpleLift*8)},${Math.floor(38+purpleLift*30)})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  // Vertical chains
  bgElements.forEach(el=>{
    if(el.type==='vchain'){
      ctx.save();ctx.translate(el.x,0);ctx.rotate(el.angle||0);
      const sc=el.scale||1, chainLen=H*(el.len||0.5);
      const op=Math.min(0.72,0.28+sc*0.28);
      const lw=2.8*sc, lh=11*sc, lgap=5*sc;
      let y=lgap;
      while(y<chainLen){
        const fade=1-(y/chainLen);
        ctx.globalAlpha=op*fade;
        ctx.fillStyle='#2d2840';ctx.strokeStyle='#100d1e';ctx.lineWidth=0.9;
        ctx.beginPath();ctx.ellipse(0,y,lw*1.9,lh/2,0,0,Math.PI*2);ctx.fill();ctx.stroke();
        if(y+lh<chainLen){ctx.beginPath();ctx.ellipse(0,y+lh/2+lgap/2,lw/2,lh*0.6,Math.PI/2,0,Math.PI*2);ctx.fill();ctx.stroke();}
        y+=lh+lgap*2;
      }
      ctx.globalAlpha=1;ctx.restore();
    } else if(el.type==='root'&&el.currentHeight>0){
      ctx.save();ctx.globalAlpha=0.55;ctx.strokeStyle='#0d0a00';ctx.lineWidth=2;ctx.lineCap='round';
      const bx=el.x,by=H;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx+el.curve*el.currentHeight,by-el.currentHeight*0.5,bx+el.curve*el.currentHeight*1.4,by-el.currentHeight);ctx.stroke();
      if(el.currentHeight>60){ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx+el.curve*el.currentHeight*0.7,by-el.currentHeight*0.5);ctx.quadraticCurveTo(bx+el.curve*80,by-el.currentHeight*0.75,bx+el.curve*100,by-el.currentHeight*0.65);ctx.stroke();}
      ctx.restore();
    }
  });
}

// ── draw player (Laila) — two-layer hair, animated float ──────────────────────
function drawPlayer(){
  if(player.iframes>0&&Math.floor(player.iframes/5)%2===0)return;
  if(player.stillnessActive)ctx.globalAlpha=0.4;
  const{x,y}=player;
  const t=frameCount*0.016;
  // Hair wings: only ear/wing/tip points sway (crown/neck fixed). Left-right + tiny y.
  const hwX=Math.sin(t*0.54)*2.8, hwY=Math.sin(t*0.80)*0.28;
  // Bangs: small x+y float
  const fBg={x:Math.sin(t*0.61+1.2)*0.4, y:Math.sin(t*0.87+1.2)*0.5};
  // Body: x-only (no up/down translation)
  const fBoX=Math.sin(t*0.44+2.5)*0.5;
  // Dress: width oscillation (widen/shorten, NOT y-translation)
  const dW=Math.sin(t*0.68+2.5)*1.5; // hem width ±1.5
  // Sleeves: x-only pendulum (left/right swing opposite)
  const slX=Math.sin(t*0.50+0.8)*1.4;
  // Aura
  if(projectileLevel>0){
    ctx.save();ctx.translate(x+fBoX,y);
    const ac=['','rgba(255,255,255,0.07)','rgba(180,220,255,0.11)','rgba(0,204,102,0.16)'][projectileLevel];
    const ar=[0,20,26,32][projectileLevel];
    const ag=ctx.createRadialGradient(0,0,0,0,0,ar);ag.addColorStop(0,ac);ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag;ctx.beginPath();ctx.arc(0,0,ar,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // ── L1 HAIR (behind face) — crown/neck FIXED, only ear/wing/tip sway ──
  ctx.save();ctx.translate(x,y); // NO whole-shape float; point deformation handles motion
  const _l1a=_L1PTS.map(([px,py],i)=>{
    if([1,2,3].includes(i))   return[px+hwX, py+hwY];  // right ear/wing/tip sway
    if([7,8,9].includes(i))   return[px-hwX, py+hwY];  // left ear/wing/tip (mirror)
    return[px,py];                                       // everything else fixed
  });
  glow('#ff2222',8);ctx.fillStyle=COL.hair;
  ctx.beginPath();_crPath(_l1a);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(80,0,0,0.18)';
  ctx.beginPath();ctx.moveTo(0,-23.6);ctx.quadraticCurveTo(-3,-24.9,-6,-24.9);ctx.quadraticCurveTo(-10.7,-18.1,0,-4.3);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,100,60,0.10)';
  ctx.beginPath();ctx.moveTo(0,-23.6);ctx.quadraticCurveTo(3,-24.9,6,-24.9);ctx.quadraticCurveTo(10.7,-18.1,0,-4.3);ctx.closePath();ctx.fill();
  noGlow();ctx.restore();
  // ── BODY ──
  ctx.save();ctx.translate(x+fBoX,y); // x-only body sway, NO y translation
  const hemY=18; // dress hem y (longer)
  // Feet: skin, closer together (gap≈1), top shadow (dress casts shadow down)
  ctx.fillStyle=COL.laila;ctx.fillRect(-3.5,hemY,3,6);ctx.fillRect(0.5,hemY,3,6);
  ctx.fillStyle='rgba(8,0,0,0.65)';
  ctx.fillRect(-3.5,hemY,3,1.5); // top shadow strip left foot
  ctx.fillRect(0.5, hemY,3,1.5); // top shadow strip right foot
  // Hands: shadow at TOP (sleeve covers top, shadow at that edge)
  const hx=11,hy=7.5,hr=3;
  ctx.fillStyle='#0d0808';
  ctx.beginPath();ctx.arc(-hx,hy-hr*0.6,hr+0.9,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx, hy-hr*0.6,hr+0.9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COL.laila;
  ctx.beginPath();ctx.arc(-hx,hy,hr,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx, hy,hr,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(50,8,0,0.42)';
  const saL=Math.atan2(8,-3.5),saR=Math.atan2(8,3.5);
  ctx.save();ctx.beginPath();ctx.arc(-hx,hy,hr,0,Math.PI*2);ctx.clip();
  ctx.translate(-hx,hy-hr*0.25);ctx.rotate(saL);
  ctx.beginPath();ctx.ellipse(0,0,hr*0.78,hr*0.14,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.clip();
  ctx.translate(hx,hy-hr*0.25);ctx.rotate(saR);
  ctx.beginPath();ctx.ellipse(0,0,hr*0.78,hr*0.14,0,0,Math.PI*2);ctx.fill();ctx.restore();
  // Dress: longer (hemY=18) + widen/shorten animation (hem x oscillates)
  const hw=15+dW; // base 15, oscillates ±1.5
  glow('#eeeeff',8);ctx.fillStyle=COL.dress;
  ctx.beginPath();ctx.moveTo(-7,-3);ctx.lineTo(-hw,hemY);ctx.lineTo(hw,hemY);ctx.lineTo(7,-3);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='rgba(180,175,200,0.22)';
  ctx.beginPath();ctx.moveTo(-7,-3);ctx.lineTo(-hw,hemY);ctx.lineTo(-hw*0.33,hemY);ctx.lineTo(-1,-3);ctx.closePath();ctx.fill();
  // Sleeves: x-only pendulum, left/right opposite directions
  ctx.fillStyle=COL.dress;
  ctx.beginPath();ctx.moveTo(-7.5-slX,-0.5);ctx.lineTo(-13-slX,8.5);ctx.lineTo(-10-slX,7.5);ctx.lineTo(-8.5-slX,3);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(7.5+slX,-0.5);ctx.lineTo(13+slX,8.5);ctx.lineTo(10+slX,7.5);ctx.lineTo(8.5+slX,3);ctx.closePath();ctx.fill();
  noGlow();ctx.restore();
  // ── FACE ──
  ctx.save();ctx.translate(x+fBoX,y);
  glow(COL.laila,10);ctx.fillStyle=COL.laila;ctx.beginPath();ctx.arc(0,-11,9,0,Math.PI*2);ctx.fill();noGlow();
  const eg=projectileLevel>0?['','#66dd66','#88ccff','#00ff88'][projectileLevel]:'#44cc44';
  ctx.fillStyle='#182418';ctx.beginPath();ctx.arc(-4,-11,2.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-11,2.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=eg;ctx.beginPath();ctx.arc(-4,-11,2.0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-11,2.0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,40,0,0.28)';ctx.beginPath();ctx.arc(-4,-10.4,1.8,0.1*Math.PI,0.9*Math.PI);ctx.fill();ctx.beginPath();ctx.arc(4,-10.4,1.8,0.1*Math.PI,0.9*Math.PI);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(-4.8,-11.8,0.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3.2,-11.8,0.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(140,90,40,0.35)';ctx.beginPath();ctx.arc(-1.1,-8,0.9,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(1.1,-8,0.9,0,Math.PI*2);ctx.fill();
  noGlow();ctx.restore();
  // ── L2 BANGS (in front of face) ──
  ctx.save();ctx.translate(x+fBg.x+fBoX*0.5,y+fBg.y);
  glow('#ff2222',5);ctx.fillStyle=COL.hair;
  ctx.beginPath();_crPath(_L2PTS);ctx.closePath();ctx.fill();
  ctx.beginPath();_crPath(_L2PTS.map(([px,py])=>[-px,py]));ctx.closePath();ctx.fill();
  noGlow();ctx.restore();
  // ── STRANDS (float with hair wings) ──
  ctx.save();ctx.translate(x,y);
  const sfY=Math.sin(t*0.55)*1.1,sfX=Math.sin(t*0.42+1.4)*0.6;
  glow('#cc1111',4);ctx.strokeStyle='#cc2222';ctx.lineWidth=0.7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(1,-22.2);ctx.quadraticCurveTo(-5.3+sfX*0.35,-13+sfY*0.35,25.5+sfX,-7+sfY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-1,-22.2);ctx.quadraticCurveTo(5.3-sfX*0.35,-13+sfY*0.35,-25.5-sfX,-7+sfY);ctx.stroke();
  if(projectileLevel===3){ctx.strokeStyle='#1a0a22';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-3,-24);ctx.quadraticCurveTo(-9,-35,-6,-41);ctx.stroke();ctx.beginPath();ctx.moveTo(3,-24);ctx.quadraticCurveTo(9,-35,6,-41);ctx.stroke();}
  noGlow();ctx.restore();

  ctx.globalAlpha=1;
  if(player.stillnessActive){const ring=1-(player.stillnessTimer/120);ctx.strokeStyle=`rgba(255,255,255,${0.4*(1-ring)})`;ctx.lineWidth=1.5;glow('#ffffff',8);ctx.beginPath();ctx.arc(x+fBoX,y,36+ring*30,0,Math.PI*2);ctx.stroke();noGlow();}
}

// ── draw Laila variant (reflection / shadow) ───────────────────────────────────
// Full current-sprite Laila with float animation, parameterised palette + hair
function drawLailaVariant(x, y, opts){
  const {
    floatOff=0, scale=1, mirror=false, alpha=1,
    hairCol='#1a0808', dressCol='#040c04', skinCol='#0a1008',
    eyeCol='#cc0000', eyeGlow='#880000',
    eyePulse=false, eyeOverrideAlpha=-1,
    l1Mod=null
  } = opts||{};

  const ft  = frameCount*0.016 + floatOff;
  const hwX = Math.sin(ft*0.54)*2.8, hwY = Math.sin(ft*0.80)*0.28;
  const fBgX= Math.sin(ft*0.61+1.2)*0.4, fBgY=Math.sin(ft*0.87+1.2)*0.5;
  const fBoX= Math.sin(ft*0.44+2.5)*0.5;
  const dW  = Math.sin(ft*0.68+2.5)*1.5;
  const slX = Math.sin(ft*0.50+0.8)*1.4;
  const sfY = Math.sin(ft*0.55)*1.1, sfX=Math.sin(ft*0.42+1.4)*0.6;
  const hemY= 18;
  const eyeA= eyeOverrideAlpha>=0 ? eyeOverrideAlpha :
              (eyePulse ? 0.55+0.45*Math.sin(frameCount*0.09) : 1);

  ctx.save();
  ctx.translate(x, y);
  if(mirror) ctx.scale(-1,1);
  ctx.scale(scale, scale);
  ctx.globalAlpha=alpha;

  // L1 hair (behind face) — animated wing sway + optional per-variant point mod
  const l1base = l1Mod ? _L1PTS.map(l1Mod) : _L1PTS;
  const l1a = l1base.map(([px,py],i)=>{
    if([1,2,3].includes(i)) return [px+hwX, py+hwY];
    if([7,8,9].includes(i)) return [px-hwX, py+hwY];
    return [px,py];
  });
  ctx.fillStyle=hairCol;
  ctx.beginPath(); _crPath(l1a); ctx.closePath(); ctx.fill();

  // Feet + top shadow strip
  ctx.fillStyle=skinCol;
  ctx.fillRect(-3.5+fBoX,hemY,3,6); ctx.fillRect(0.5+fBoX,hemY,3,6);
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(-3.5+fBoX,hemY,3,1.5); ctx.fillRect(0.5+fBoX,hemY,3,1.5);

  // Hand shadow + hands
  ctx.fillStyle='#000006';
  ctx.beginPath();ctx.arc(-11+fBoX,7.5-1.8,3.9,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc( 11+fBoX,7.5-1.8,3.9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=skinCol;
  ctx.beginPath();ctx.arc(-11+fBoX,7.5,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc( 11+fBoX,7.5,3,0,Math.PI*2);ctx.fill();

  // Dress body + shadow strip + sleeves
  const hw=15+dW;
  ctx.fillStyle=dressCol;
  ctx.beginPath();ctx.moveTo(-7+fBoX,-3);ctx.lineTo(-hw+fBoX,hemY);ctx.lineTo(hw+fBoX,hemY);ctx.lineTo(7+fBoX,-3);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.moveTo(-7+fBoX,-3);ctx.lineTo(-hw+fBoX,hemY);ctx.lineTo(Math.floor(-hw*0.33)+fBoX,hemY);ctx.lineTo(-1+fBoX,-3);ctx.closePath();ctx.fill();
  ctx.fillStyle=dressCol;
  ctx.beginPath();ctx.moveTo(-7.5-slX+fBoX,-0.5);ctx.lineTo(-13-slX+fBoX,8.5);ctx.lineTo(-10-slX+fBoX,7.5);ctx.lineTo(-8.5-slX+fBoX,3);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo( 7.5+slX+fBoX,-0.5);ctx.lineTo( 13+slX+fBoX,8.5);ctx.lineTo( 10+slX+fBoX,7.5);ctx.lineTo(  8.5+slX+fBoX,3);ctx.closePath();ctx.fill();

  // Face
  ctx.fillStyle=skinCol;
  ctx.beginPath();ctx.arc(fBoX,-11,9,0,Math.PI*2);ctx.fill();

  // Eyes — inner dark + colored iris + specular
  ctx.fillStyle='#100808';
  ctx.beginPath();ctx.arc(-4+fBoX,-11,2.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc( 4+fBoX,-11,2.8,0,Math.PI*2);ctx.fill();
  if(eyeA>0){
    glow(eyeGlow, 10*eyeA);
    ctx.globalAlpha=alpha*eyeA;
    ctx.fillStyle=eyeCol;
    ctx.beginPath();ctx.arc(-4+fBoX,-11,2.0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( 4+fBoX,-11,2.0,0,Math.PI*2);ctx.fill();
    noGlow(); ctx.globalAlpha=alpha;
  }
  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.beginPath();ctx.arc(-4.8+fBoX,-11.8,0.7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc( 3.2+fBoX,-11.8,0.7,0,Math.PI*2);ctx.fill();

  // L2 bangs (in front of face)
  ctx.fillStyle=hairCol;
  ctx.beginPath(); _crPath(_L2PTS, fBgX+fBoX*0.5, fBgY); ctx.closePath(); ctx.fill();
  ctx.beginPath(); _crPath(_L2PTS.map(([px,py])=>[-px,py]), fBgX+fBoX*0.5, fBgY); ctx.closePath(); ctx.fill();

  // Hair strands
  ctx.strokeStyle=hairCol; ctx.lineWidth=0.7; ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(1,-22.2);ctx.quadraticCurveTo(-5.3+sfX*0.35,-13+sfY*0.35,25.5+sfX,-7+sfY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-1,-22.2);ctx.quadraticCurveTo(5.3-sfX*0.35,-13+sfY*0.35,-25.5-sfX,-7+sfY);ctx.stroke();

  ctx.restore();
}

// ── draw enemies ───────────────────────────────────────────────────────────────
function drawEnemy(e){
  if(e.dead)return;
  const col=getEnemyColor(e);
  ctx.save();
  switch(e.type){

    case 'rotwood':{
      ctx.translate(e.x,e.y);glow(col,8);ctx.strokeStyle='#2a1608';ctx.lineWidth=3;ctx.lineCap='round';
      // Waterlogged log chunk — irregular stroked rect
      ctx.fillStyle='#2a1608';ctx.beginPath();
      ctx.moveTo(-e.w*0.5,-e.h*0.4);ctx.lineTo(e.w*0.48,-e.h*0.5);ctx.lineTo(e.w*0.52,e.h*0.5);ctx.lineTo(-e.w*0.48,e.h*0.48);ctx.closePath();ctx.fill();ctx.stroke();
      // Grain lines
      ctx.strokeStyle='#1a0e04';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-e.w*0.3,-e.h*0.3);ctx.lineTo(-e.w*0.25,e.h*0.3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(e.w*0.1,-e.h*0.4);ctx.lineTo(e.w*0.12,e.h*0.4);ctx.stroke();
      break;
    }

    case 'deeplight':{
      ctx.translate(e.x,e.y);
      const dp=0.7+Math.sin(frameCount*0.08)*0.3;
      glow('#88ccff',16);ctx.globalAlpha=dp;
      const dg=ctx.createRadialGradient(0,0,0,0,0,e.w/2);
      dg.addColorStop(0,'rgba(180,230,255,0.9)');dg.addColorStop(1,'rgba(136,204,255,0.1)');
      ctx.fillStyle=dg;ctx.beginPath();ctx.arc(0,0,e.w/2,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      break;
    }

    case 'lakemoss':{
      ctx.translate(e.x,e.y);glow('#4a6a3a',8);
      const tv=Date.now()*0.0008;ctx.fillStyle='rgba(60,90,48,0.55)';
      ctx.beginPath();
      for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2,r=(e.w/2)*(0.6+0.4*Math.sin(a*2.8+tv));i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r*(e.h/e.w)):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r*(e.h/e.w));}
      ctx.closePath();ctx.fill();
      // Bloom ring if active
      if(e.special.bloomR>0){
        ctx.strokeStyle='rgba(80,120,60,0.35)';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(0,0,e.special.bloomR,0,Math.PI*2);ctx.stroke();
      }
      break;
    }

    case 'hand':{
      ctx.translate(e.x,e.y);
      const sc=e.special.size||1;
      const hue=Math.min(8+zoneWave*8,28);
      const fc=`hsl(${hue},80%,30%)`, fc2=`hsl(${hue},80%,18%)`, oc=`hsl(${hue},80%,11%)`;
      glow(fc,12);ctx.save();ctx.scale(sc,sc);
      const pw=e.w*0.70, fws=[e.w*0.12,e.w*0.13,e.w*0.13,e.w*0.11];
      const fhs=[e.h*0.52,e.h*0.60,e.h*0.57,e.h*0.44];
      const fxs=[-pw*0.34,-pw*0.11,pw*0.11,pw*0.34];
      // Fingers (drawn first, behind palm)
      fxs.forEach((fx,i)=>{
        const fw2=fws[i],fh2=fhs[i];
        ctx.fillStyle=fc;ctx.strokeStyle=oc;ctx.lineWidth=1.1;
        ctx.beginPath();
        ctx.moveTo(fx-fw2/2,e.h*0.06);ctx.lineTo(fx-fw2/2,-fh2+fw2/2);
        ctx.quadraticCurveTo(fx-fw2/2,-fh2,fx,-fh2);
        ctx.quadraticCurveTo(fx+fw2/2,-fh2,fx+fw2/2,-fh2+fw2/2);
        ctx.lineTo(fx+fw2/2,e.h*0.06);ctx.closePath();ctx.fill();ctx.stroke();
        // Knuckle crease
        ctx.strokeStyle=oc;ctx.lineWidth=0.7;
        ctx.beginPath();ctx.moveTo(fx-fw2*0.3,-fh2*0.4);ctx.lineTo(fx+fw2*0.3,-fh2*0.4);ctx.stroke();
      });
      // Palm — cell shaded (light side + shadow side)
      ctx.fillStyle=fc;ctx.strokeStyle=oc;ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(-pw/2+3,e.h*0.08);ctx.quadraticCurveTo(-pw/2-3,e.h*0.08,-pw/2-3,e.h*0.14);
      ctx.lineTo(-pw/2-3,e.h*0.38);ctx.quadraticCurveTo(-pw/2-3,e.h*0.44,pw/2+3,e.h*0.44);
      ctx.lineTo(pw/2+3,e.h*0.14);ctx.quadraticCurveTo(pw/2+3,e.h*0.08,pw/2-3,e.h*0.08);
      ctx.closePath();ctx.fill();ctx.stroke();
      // Shadow side of palm
      ctx.fillStyle=fc2;
      ctx.beginPath();ctx.moveTo(-pw/2-3,e.h*0.14);ctx.lineTo(-pw/2-3,e.h*0.44);ctx.lineTo(-pw/2+pw*0.38,e.h*0.44);ctx.lineTo(-pw/2+pw*0.38,e.h*0.08);ctx.quadraticCurveTo(-pw/2+3,e.h*0.08,-pw/2+3,e.h*0.08);ctx.quadraticCurveTo(-pw/2-3,e.h*0.08,-pw/2-3,e.h*0.14);ctx.fill();
      // Thumb (right side, angled outward)
      ctx.fillStyle=fc;ctx.strokeStyle=oc;ctx.lineWidth=1.1;
      ctx.save();ctx.translate(pw/2+3,e.h*0.16);ctx.rotate(-0.55);
      const tw=e.w*0.1,th=e.h*0.27;
      ctx.beginPath();ctx.moveTo(-tw/2,th/2);ctx.lineTo(-tw/2,-th/2+tw/2);ctx.quadraticCurveTo(-tw/2,-th/2,0,-th/2);ctx.quadraticCurveTo(tw/2,-th/2,tw/2,-th/2+tw/2);ctx.lineTo(tw/2,th/2);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();ctx.restore();
      break;
    }

    case 'seeker':{
      ctx.translate(e.x,e.y);glow('#ffaa20',14);
      // Eye body
      ctx.fillStyle='#3a1800';ctx.beginPath();ctx.ellipse(0,0,e.w/2,e.h*0.38,0,0,Math.PI*2);ctx.fill();
      // Iris
      ctx.fillStyle='#aa6600';ctx.beginPath();ctx.arc(0,0,e.w*0.28,0,Math.PI*2);ctx.fill();
      // Pupil tracking player
      const sa=Math.atan2(player.y-e.y,player.x-e.x);
      const px2=Math.cos(sa)*e.w*0.1,py2=Math.sin(sa)*e.w*0.1;
      ctx.fillStyle='#ffaa20';ctx.beginPath();ctx.arc(px2,py2,e.w*0.12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(px2,py2,e.w*0.06,0,Math.PI*2);ctx.fill();
      // Tendrils
      ctx.strokeStyle='#3a1800';ctx.lineWidth=2;ctx.lineCap='round';
      [0.4,0,-0.4].forEach((ang,i)=>{ctx.beginPath();ctx.moveTo(Math.sin(ang)*8,e.h*0.3);ctx.quadraticCurveTo(Math.sin(ang+0.3)*14,e.h*0.55,Math.sin(ang)*10,e.h*0.7+i*4);ctx.stroke();});
      break;
    }

    case 'handcluster':{
      ctx.translate(e.x,e.y);glow('#aa1818',16);ctx.fillStyle='#8b0000';
      // Draw 5 overlapping hands at offsets
      const osc=Math.sin(frameCount*0.15)*2;
      [[0,0],[-10,4],[10,-4],[-5,-8],[5,8]].forEach(([ox,oy])=>{
        ctx.save();ctx.translate(ox+osc,oy);ctx.scale(0.7,0.7);
        ctx.fillRect(-13,3,26,12);
        [-9,-3,3,9].forEach(fx=>ctx.fillRect(fx-4,-18,7,18));
        ctx.restore();
      });
      break;
    }

    case 'reflection':{
      if(e.special.respawnTimer>0)break;
      // Full Laila sprite — dark cold palette, hair swept upward (underwater float)
      // Zone 2 = crimson eyes (zone of hunger/hands, Laila's power-fear)
      drawLailaVariant(e.x, e.y, {
        floatOff: e.x*0.008,           // unique float phase per instance
        mirror:   true,
        alpha:    0.54,
        hairCol:  '#141222',            // near-black purple hair
        dressCol: '#0a1220',            // dark cold-blue dress
        skinCol:  '#14202e',            // cold grey-blue skin
        eyeCol:   '#bb1100',            // dark crimson — Zone 2 menace
        eyeGlow:  '#550000',
        eyePulse: true,
        l1Mod: ([px,py],i) =>           // hair swept upward — floating in water
          ([1,2,3,7,8,9].includes(i)) ? [px, py-7] : [px,py]
      });
      break;
    }

    case 'glitch':{
      if(!e.special.visible)break;
      ctx.translate(e.x,e.y);
      // Corrupted hand shape — offset segments in neon
      [[0,'#ff6600'],[-4,'#0066ff'],[3,'#00ff88']].forEach(([ox,gc])=>{
        ctx.save();ctx.translate(ox,0);ctx.globalAlpha=0.7;ctx.fillStyle=gc;
        ctx.fillRect(-10,3,20,10);[-8,-2,4,10].forEach(fx=>ctx.fillRect(fx-4,-15,6,16));
        ctx.restore();
      });
      // Pixelated edge noise
      glow('#ff6600',10);ctx.fillStyle='#ff6600';
      for(let i=0;i<4;i++)ctx.fillRect(-12+Math.random()*24,-18+Math.random()*36,2,2);
      break;
    }

    case 'decoy':{
      const s=e.special;
      if(s.disguised){
        // Looks like a HUD feather
        ctx.translate(e.x,e.y);ctx.rotate(Math.sin(Date.now()/800)*0.1);
        ctx.strokeStyle='#f0f0f0';ctx.lineWidth=1.2;ctx.lineCap='round';glow('#f0f0f0',6);
        const dr=8;ctx.beginPath();ctx.moveTo(0,-dr);ctx.quadraticCurveTo(dr*0.7,0,0,dr);ctx.quadraticCurveTo(-dr*0.7,0,0,-dr);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,-dr);ctx.lineTo(0,dr);ctx.stroke();
      } else {
        ctx.translate(e.x,e.y);glow('#ff4400',18);ctx.fillStyle='#cc2200';
        ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ff6600';ctx.beginPath();ctx.arc(-2,-2,5,0,Math.PI*2);ctx.fill();
      }
      break;
    }

    case 'echo':{
      ctx.translate(e.x,e.y);
      const comps=e.special.comps;
      const offs=[{ox:-16,col:'#ff4444'},{ox:0,col:'#44ff44'},{ox:16,col:'#4444ff'}];
      offs.forEach(({ox,col:cc},i)=>{
        if(comps[i].dead)return;
        ctx.save();ctx.translate(ox,0);ctx.globalAlpha=0.62;
        // Mini Laila silhouette
        ctx.fillStyle=cc;
        ctx.beginPath();ctx.arc(0,-e.h/2+8,7,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-14,e.h/2);ctx.lineTo(14,e.h/2);ctx.lineTo(7,0);ctx.closePath();ctx.fill();
        ctx.restore();
      });
      ctx.globalAlpha=1;
      break;
    }

    case 'signal':{
      ctx.translate(e.x,e.y);glow('#00ccff',14);ctx.strokeStyle='#00ccff';ctx.lineWidth=1.5;
      // Hexagon body
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6;ctx.lineTo(Math.cos(a)*e.w/2,Math.sin(a)*e.w/2);}
      ctx.closePath();ctx.stroke();
      // Inner detail
      ctx.strokeStyle='rgba(0,204,255,0.4)';ctx.lineWidth=1;
      ctx.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6;ctx.lineTo(Math.cos(a)*e.w*0.3,Math.sin(a)*e.w*0.3);}ctx.closePath();ctx.stroke();
      // Pulse rings
      e.special.waves.forEach(w=>{
        ctx.globalAlpha=w.opacity*0.5;ctx.strokeStyle='#00ccff';ctx.lineWidth=1;
        // Draw ring with 4 gaps at N/E/S/W
        for(let seg=0;seg<8;seg++){const a1=(seg/8)*Math.PI*2,a2=((seg+0.7)/8)*Math.PI*2;ctx.beginPath();ctx.arc(0,0,w.r,a1,a2);ctx.stroke();}
      });
      ctx.globalAlpha=1;
      break;
    }

    case 'root':{
      ctx.translate(e.x,e.y);glow('#2a1a00',8);ctx.strokeStyle='#1a0e00';ctx.lineWidth=2.5;ctx.lineCap='round';
      const tv2=Date.now()*0.0005;
      // 3 interweaving root tendrils
      [[-0.4,0.3],[0,0.5],[0.35,-0.2]].forEach((c,i)=>{
        const osc2=Math.sin(tv2+i)*4;
        ctx.beginPath();ctx.moveTo(0,e.h*0.5);
        ctx.quadraticCurveTo(c[0]*e.w+osc2,-e.h*0.1,c[1]*e.w+osc2,-e.h*0.5);ctx.stroke();
      });
      break;
    }

    case 'chain':{
      const s=e.special;
      const segs=[{x:e.x,y:e.y,hp:e.hp},{x:s.s2x,y:s.s2y,hp:s.s2hp},{x:s.s3x,y:s.s3y,hp:s.s3hp}];
      // Draw connecting lines first
      ctx.strokeStyle='rgba(42,37,53,0.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
      for(let i=0;i<segs.length-1;i++){
        if(segs[i].hp>0&&segs[i+1].hp>0){ctx.beginPath();ctx.moveTo(segs[i].x,segs[i].y);ctx.lineTo(segs[i+1].x,segs[i+1].y);ctx.stroke();}
      }
      ctx.setLineDash([]);
      // Draw each segment
      segs.forEach((sg,i)=>{
        if(sg.hp<=0)return;
        ctx.save();ctx.translate(sg.x,sg.y);
        glow('#2a2535',10);ctx.fillStyle=i===0?'#3a3050':'#2a2535';
        ctx.beginPath();ctx.ellipse(0,0,11,8,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
      });
      break;
    }

    case 'owlguardian':{
      ctx.translate(e.x,e.y);
      const sweeping=!e.special.perched;
      ctx.globalAlpha=sweeping?0.9:0.7;
      glow('#4a3a6a',sweeping?18:10);ctx.fillStyle='#0d0a18';
      // Wings
      ctx.beginPath();ctx.moveTo(-e.w*0.12,e.h*0.05);ctx.bezierCurveTo(-e.w*0.55,-e.h*0.28,-e.w*0.78,e.h*0.22,-e.w*0.5,e.h*0.4);ctx.bezierCurveTo(-e.w*0.28,e.h*0.3,-e.w*0.12,e.h*0.18,-e.w*0.12,e.h*0.05);ctx.fill();
      ctx.beginPath();ctx.moveTo(e.w*0.12,e.h*0.05);ctx.bezierCurveTo(e.w*0.55,-e.h*0.28,e.w*0.78,e.h*0.22,e.w*0.5,e.h*0.4);ctx.bezierCurveTo(e.w*0.28,e.h*0.3,e.w*0.12,e.h*0.18,e.w*0.12,e.h*0.05);ctx.fill();
      // Body + head
      ctx.fillStyle='#0a0815';ctx.beginPath();ctx.ellipse(0,e.h*0.15,e.w*0.22,e.h*0.35,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(0,-e.h*0.22,e.w*0.18,0,Math.PI*2);ctx.fill();
      // Amber eyes (dim — this is the shadow version)
      const ep=sweeping?0.8+0.2*Math.sin(frameCount*0.2):0.4;
      glow('#ffaa00',12*ep);ctx.fillStyle=`rgba(255,170,0,${ep*0.7})`;
      ctx.beginPath();ctx.arc(-e.w*0.08,-e.h*0.22,e.w*0.058,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.w*0.08,-e.h*0.22,e.w*0.058,0,Math.PI*2);ctx.fill();
      // Swoop feather trails
      if(sweeping){
        ctx.strokeStyle='rgba(74,58,106,0.4)';ctx.lineWidth=1.5;ctx.lineCap='round';
        for(let ft=0;ft<6;ft++){
          const foff=(ft-3)*8;
          ctx.beginPath();ctx.moveTo(foff,-e.h*0.1);ctx.lineTo(foff-Math.cos(e.special.swoopAngle)*20,e.h*0.1);ctx.stroke();
        }
      }
      ctx.globalAlpha=1;
      break;
    }

  }
  noGlow();ctx.restore();
}

// ── draw drops ─────────────────────────────────────────────────────────────────
function drawDrop(d){

    case'stillness':glow('#ffffff',18);ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();break;

}

// ── draw boss ──────────────────────────────────────────────────────────────────
function drawOwlBody(x,y,w,h,fillCol,eyeCol,eyeAlpha){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle=fillCol;ctx.strokeStyle='#000';ctx.lineWidth=1.2;
  // Wings
  ctx.beginPath();ctx.moveTo(-w*0.12,h*0.05);ctx.bezierCurveTo(-w*0.55,-h*0.3,-w*0.80,h*0.22,-w*0.50,h*0.44);ctx.bezierCurveTo(-w*0.28,h*0.32,-w*0.12,h*0.18,-w*0.12,h*0.05);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*0.12,h*0.05);ctx.bezierCurveTo(w*0.55,-h*0.3,w*0.80,h*0.22,w*0.50,h*0.44);ctx.bezierCurveTo(w*0.28,h*0.32,w*0.12,h*0.18,w*0.12,h*0.05);ctx.fill();ctx.stroke();
  // Body + head
  ctx.beginPath();ctx.ellipse(0,h*0.12,w*0.26,h*0.42,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,-h*0.28,w*0.20,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Ear tufts
  ctx.beginPath();ctx.moveTo(-w*0.09,-h*0.46);ctx.lineTo(-w*0.17,-h*0.28);ctx.lineTo(-w*0.02,-h*0.28);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*0.09,-h*0.46);ctx.lineTo(w*0.17,-h*0.28);ctx.lineTo(w*0.02,-h*0.28);ctx.closePath();ctx.fill();ctx.stroke();
  // Eyes
  ctx.globalAlpha=eyeAlpha;glow(eyeCol,18);ctx.fillStyle=eyeCol;
  ctx.beginPath();ctx.arc(-w*0.09,-h*0.28,w*0.07,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*0.09,-h*0.28,w*0.07,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(-w*0.09,-h*0.28,w*0.032,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*0.09,-h*0.28,w*0.032,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;noGlow();ctx.restore();
}

function drawBossHPBar(x,y,w,h,hp,maxHp){
  const bw=160,bh=6,bx=x-bw/2,by=y-h/2-20;

  ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);noGlow();
}

function drawBoss(){
  if(!boss)return;
  const{x,y,w,h,hp,maxHp,phase}=boss;
  ctx.save();
  if     (currentZone===1) drawBoss_z1();
  else if(currentZone===2) drawBoss_z2();

  else                     drawBoss_z4();

function drawMidHand(){
  if(!midHand)return;
  const m=midHand;
  if(m.y-340>H)return;
  ctx.save();
  ctx.translate(m.x,m.y);

  const isExp=m.phase==='exposed';
  const curl=m.curlProgress||0;
  const baseHue=8+zoneWave*8;
  const isHit=m.flashTimer>0&&Math.floor(m.flashTimer/3)%2===0;
  const pulse=isExp?(0.65+0.35*Math.sin(frameCount*0.1)):0.5;
  let palmC,outC,glowC,glowB;
  if(m.phase==='telegraphing'||m.phase==='slamming'){
    palmC=`hsl(${baseHue},90%,20%)`;outC='#1a0000';glowC='#ff1100';glowB=14;
  }else{
    palmC=isHit?'#ffffff':`hsl(${baseHue},80%,${18+pulse*20}%)`;
    outC=isHit?'#ffffff':'#1a0000';
    glowC=isExp?'#ff4400':'#8b2030';glowB=isExp?20:6;
  }

  glow(glowC,glowB);
  ctx.fillStyle=palmC;ctx.strokeStyle=outC;ctx.lineWidth=3;

  // Wrist taper (connects palm to off-screen bottom)
  ctx.beginPath();
  ctx.moveTo(-82,0);ctx.lineTo(82,0);ctx.lineTo(95,-90);ctx.lineTo(-95,-90);
  ctx.closePath();ctx.fill();ctx.stroke();

  // Palm (trapezoid, widening toward fingers)
  const ptop=-220;
  ctx.beginPath();
  ctx.moveTo(-95,-90);ctx.lineTo(95,-90);
  ctx.lineTo(88,ptop);ctx.lineTo(-88,ptop);
  ctx.closePath();ctx.fill();ctx.stroke();

  // 4 Fingers
  const fLen=108,fW=29,fSpc=50,fOff=-75;
  for(let i=0;i<4;i++){
    const fx=fOff+i*fSpc;
    ctx.save();
    ctx.translate(fx,ptop);
    ctx.rotate(curl*Math.PI);
    ctx.fillStyle=palmC;ctx.strokeStyle=outC;ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(-fW/2,0);ctx.lineTo(-fW/2,-(fLen-fW/2));
    ctx.arc(0,-(fLen-fW/2),fW/2,Math.PI,0);
    ctx.lineTo(fW/2,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(-fW*0.38,-fLen*0.38);ctx.lineTo(fW*0.38,-fLen*0.38);ctx.stroke();
    ctx.restore();
  }

  // Thumb (left side, angled outward, curls inward)
  ctx.save();
  ctx.translate(-88+12,ptop+60);
  ctx.rotate(-Math.PI*0.22+curl*Math.PI*0.72);
  const tLen=75,tW=25;
  ctx.fillStyle=palmC;ctx.strokeStyle=outC;ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-tW/2,0);ctx.lineTo(-tW/2,-(tLen-tW/2));
  ctx.arc(0,-(tLen-tW/2),tW/2,Math.PI,0);
  ctx.lineTo(tW/2,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();

  noGlow();

  // HP bar — visible during exposed and telegraphing
  if(isExp||m.phase==='telegraphing'){
    const bw=150,bh=7,by=ptop-32,bx=-75;
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    ctx.fillStyle='#220000';ctx.fillRect(bx,by,bw,bh);
    const hf=m.hp/m.maxHp;
    ctx.fillStyle=hf>0.5?'#ff4400':hf>0.25?'#ff6600':'#ff2200';
    ctx.fillRect(bx,by,bw*hf,bh);
    // Urgent label during telegraphing
    if(m.phase==='telegraphing'){
      ctx.globalAlpha=m.curlProgress;
      ctx.font='bold 11px monospace';ctx.fillStyle='#ff2200';
      ctx.textAlign='center';ctx.fillText('INCOMING',0,by-10);
      ctx.globalAlpha=1;
    }
  }

  ctx.restore();
}

// ── HUD ────────────────────────────────────────────────────────────────────────
function drawHUD(){
  // 5-feather health, top left
  for(let i=0;i<player.maxHp;i++){
    const active=i<player.hp;
    ctx.save();
    if(!active){ctx.globalAlpha=0.18;ctx.translate(18+i*22,23);ctx.rotate(0.3);}else ctx.translate(18+i*22,20);
    const sc=active?1:0.7;
    ctx.strokeStyle=active?'#f8f8f8':'#333';ctx.lineWidth=1.4*sc;ctx.lineCap='round';
    if(active)glow('#f8f8f8',8);
    const r=10*sc;
    ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(r*0.7,0,0,r);ctx.quadraticCurveTo(-r*0.7,0,0,-r);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();
    noGlow();ctx.restore();
  }
  // Projectile indicator, bottom right
  ctx.save();ctx.translate(W-26,H-26);
  if(projectileLevel===0){glow('#44bbff',8);ctx.strokeStyle='#88ddff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.stroke();}
  else if(projectileLevel===1){glow('#ffffff',10);ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-8);ctx.quadraticCurveTo(6,0,0,8);ctx.quadraticCurveTo(-6,0,0,-8);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,8);ctx.stroke();}
  else if(projectileLevel===2){glow('#b8d8ff',8);ctx.strokeStyle='#c8e4ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,6,Math.PI*0.8,Math.PI*2.2);ctx.stroke();ctx.beginPath();ctx.arc(4,0,4,Math.PI,Math.PI*2);ctx.stroke();}
  else{glow('#00cc66',12);ctx.fillStyle='#001a08';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#00cc66';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.stroke();}
  noGlow();ctx.restore();
  // Ability indicators, bottom left
  let ay=H-18;
  if(player.hasStillness){ctx.globalAlpha=player.stillnessActive?1:0.38;ctx.fillStyle='#ffffff';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('[E] STILL',14,ay);ay-=16;ctx.globalAlpha=1;}
  if(player.hasDrift){ctx.globalAlpha=player.driftCD>0?0.22:0.38;ctx.fillStyle='#44ffcc';ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('[SHIFT] DRIFT',14,ay);ctx.globalAlpha=1;}
  // Wave cleared — subtle corner flash only
  if(enemies.length===0&&!boss&&waveDelay>0&&waveDelay<ZONE_WAVE_DELAYS[currentZone]&&bossSpawnTimer===0){
    const fade=Math.min(1,waveDelay/30)*0.18;
    ctx.globalAlpha=fade;ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,4,H);ctx.fillRect(W-4,0,4,H);// edge flash only
    ctx.globalAlpha=1;
  }
  // Boss incoming
  if(bossSpawnTimer>0){const pulse=0.5+0.5*Math.sin(frameCount*0.15);ctx.globalAlpha=pulse*0.7;ctx.fillStyle={1:'#bbddff',2:'#ffeeaa',3:'#ff88ff',4:'#88ffcc'}[currentZone];ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('— ◈ —',W/2,52);ctx.globalAlpha=1;}
  // Gameover
  // Debug panel
  if(debugMode){
    ctx.save();ctx.globalAlpha=0.7;ctx.fillStyle='#000';ctx.fillRect(W-110,H-108,108,106);ctx.globalAlpha=1;
    ctx.fillStyle='#00ff88';ctx.font='bold 11px monospace';ctx.textAlign='right';
    ctx.fillText('◈ GOD MODE',W-6,H-94);
    ctx.fillStyle='#aaaaaa';ctx.font='9px monospace';
    ctx.fillText(`Z${currentZone}  W${zoneWave}/${ZONE_WAVE_COUNTS[currentZone]}`,W-6,H-80);
    ctx.fillText('` god  ] upgrade',W-6,H-68);
    ctx.fillText('Tab skip wave',W-6,H-56);
    ctx.fillText('[ abilities  \\ zone',W-6,H-44);
    ctx.fillStyle='#88aaff';
    ctx.fillText('1 drowning  2 →Z3',W-6,H-30);
    ctx.fillText('3 →Z4  4 unchaining',W-6,H-18);
    ctx.fillText('5 true ending',W-6,H-6);
    ctx.textAlign='left';ctx.restore();
  }
  if(gameState==='gameover'){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
    glow('#880022',30);ctx.fillStyle='#cc1133';ctx.font='bold 46px monospace';ctx.fillText('THE ABYSS',W/2,H/2-88);ctx.fillText('CLAIMS YOU',W/2,H/2-36);noGlow();
    if(runCount>0){const cnt=Math.min(runCount,8);for(let i=0;i<cnt;i++)drawSmallFeather(W/2-cnt*14+i*28,H/2+12,0.5,'#bbaaff',0.8);}
    ctx.fillStyle='#ddc0ff';ctx.font='bold 20px monospace';ctx.fillText(`she has fallen ${runCount} time${runCount!==1?'s':''}`,W/2,H/2+52);
    ctx.fillStyle='#664488';ctx.font='16px monospace';ctx.fillText(`Best: ${hi}`,W/2,H/2+80);
    glow(COL.accent,14);ctx.fillStyle=COL.accent;ctx.font='bold 16px monospace';ctx.fillText('PRESS  ENTER  TO  FALL  AGAIN',W/2,H/2+118);noGlow();ctx.textAlign='left';
  }
  if(gameState==='victory'){
    ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
    glow('#ffffff',40);ctx.fillStyle='#ffffff';ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.fillText('she is free',W/2,H/2-20);noGlow();
    ctx.globalAlpha=0.5;ctx.font='16px monospace';ctx.fillStyle='#ccddff';ctx.fillText('PRESS  ENTER  TO  RETURN',W/2,H/2+40);ctx.globalAlpha=1;ctx.textAlign='left';
  }
}

// ── main draw ──────────────────────────────────────────────────────────────────
function draw(){
  if(gameState==='intro'){drawIntro();return;}

  // Cutscene overrides normal draw
  if(cutscene.active){drawCutscene();drawHUD();return;}

  // Zone transition fade
  if(zoneTransTimer>0){
    drawBackground();
    let blackA=zoneTransTimer>45?(90-zoneTransTimer)/45:zoneTransTimer/45;
    ctx.fillStyle='#000';ctx.globalAlpha=blackA;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    return;
  }

  // Screen flip — applied to game world only, HUD stays readable
  if(screenFlipped){ctx.save();ctx.translate(W,0);ctx.scale(-1,1);}

  drawBackground();

  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;glow(p.col,6);ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;noGlow();

  bullets.forEach(b=>{
    ctx.save();
    if(b.level===0){
      // Breath — bubble: transparent fill + crisp stroke + glow (the reference)
      glow('#44bbff',10);ctx.fillStyle='rgba(170,230,255,0.28)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#88ddff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
      // Specular dot (gives it the glass bubble feel)
      ctx.fillStyle='rgba(220,240,255,0.55)';ctx.beginPath();ctx.arc(b.x-b.r*0.3,b.y-b.r*0.35,b.r*0.28,0,Math.PI*2);ctx.fill();
    } else if(b.level===1){
      // Feather — same logic: transparent body + bright outline
      glow('#ffffff',12);ctx.fillStyle='rgba(240,245,255,0.22)';
      ctx.beginPath();ctx.moveTo(b.x,b.y-b.r*1.2);ctx.quadraticCurveTo(b.x+b.r*0.9,b.y,b.x,b.y+b.r*1.2);ctx.quadraticCurveTo(b.x-b.r*0.9,b.y,b.x,b.y-b.r*1.2);ctx.fill();
      ctx.strokeStyle='#e8efff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.strokeStyle='rgba(200,215,255,0.5)';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(b.x,b.y-b.r*1.2);ctx.lineTo(b.x,b.y+b.r*1.2);ctx.stroke();
    } else if(b.level===2){
      // Moonlight crescent — transparent fill + bright arc outline
      glow('#b8d8ff',12);ctx.fillStyle='rgba(190,220,255,0.2)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#c8e4ff';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
      // Moon cutout — dark circle offset
      ctx.fillStyle='rgba(4,8,18,0.75)';ctx.beginPath();ctx.arc(b.x+b.r*0.42,b.y-b.r*0.15,b.r*0.72,0,Math.PI*2);ctx.fill();
      // Specular sliver
      ctx.fillStyle='rgba(210,235,255,0.4)';ctx.beginPath();ctx.arc(b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.2,0,Math.PI*2);ctx.fill();
    } else {
      // Void — dark sphere: flat dark fill + bright green outline + inner glow
      glow('#00cc66',18);ctx.fillStyle='#020a04';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
      // Inner bright core
      ctx.fillStyle='rgba(0,255,136,0.18)';ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.45,0,Math.PI*2);ctx.fill();
    }
    noGlow();ctx.restore();
  });
  eBullets.forEach(b=>{glow(b.col,10);ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
  noGlow();

  drops.forEach(drawDrop);enemies.forEach(drawEnemy);drawBoss();drawMidHand();drawPlayer();

  if(screenFlipped)ctx.restore();// end flip — vignette + HUD always unflipped

  drawVignette();
  drawBreatheCall();
  drawZ3Events();
  drawHUD();
}

// ── loop ────────────────────────────────────────────────────────────────────────
function loop(){update();draw();requestAnimationFrame(loop);}
init();loop();

// ── design hub / cutscene editor bridge ───────────────────────────────────────
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d||!d._csed)return;
  // ── Existing cutscene-editor commands ───────────────────────────────────
  if(d.cmd==='ping'){e.source.postMessage({_csed:true,cmd:'pong',CS_PHASES,csText,EDEFS},'*');return;}
  if(d.cmd==='god'){debugMode=!debugMode;}
  if(d.cmd==='trigger'){
    if(!player||gameState!=='playing'){
      resetGameState();startGamePlay();
      setTimeout(()=>{debugMode=true;cutscene.active=false;
        if(d.type==='transition_z3')currentZone=2;
        else if(d.type==='transition_z4')currentZone=3;
        else if(d.type==='unchaining'||d.type==='true_ending'){currentZone=4;boss=null;enemies=[];}
        startCutscene(d.type);},50);
    } else {
      debugMode=true;cutscene.active=false;
      if(d.type==='transition_z3')currentZone=2;
      else if(d.type==='transition_z4')currentZone=3;
      else if(d.type==='unchaining'||d.type==='true_ending'){currentZone=4;boss=null;enemies=[];}
      startCutscene(d.type);
    }
  }
  if(d.cmd==='set_phases'&&CS_PHASES[d.type]){
    d.phases.forEach((v,i)=>{if(i<CS_PHASES[d.type].length)CS_PHASES[d.type][i]=v;});
  }
  if(d.cmd==='set_text'&&csText[d.key]!==undefined){csText[d.key]=d.value;}
  if(d.cmd==='get_state'){
    e.source.postMessage({_csed:true,cmd:'state',CS_PHASES,csText,EDEFS,
      cutscene:{active:cutscene.active,type:cutscene.type,phase:cutscene.phase,timer:cutscene.timer}},'*');
  }
  // ── New design-hub commands ──────────────────────────────────────────────
  if(d.cmd==='skip_wave'){if(gameState==='playing'){enemies=[];boss=null;waveDelay=1;}}
  if(d.cmd==='skip_zone'){if(gameState==='playing'&&currentZone<4)zoneTransTimer=90;}
  if(d.cmd==='kill_boss'){if(boss&&gameState==='playing')onBossDefeated();}
  if(d.cmd==='set_zone'&&gameState==='playing'){enemies=[];boss=null;cutscene.active=false;initZone(d.zone);spawnWave();}
  if(d.cmd==='set_projectile'){projectileLevel=Math.min(3,Math.max(0,d.level));}
  if(d.cmd==='set_player_stat'&&player){player[d.key]=d.value;}
  if(d.cmd==='heal'&&player){player.hp=player.maxHp;}
  if(d.cmd==='grant_drift'&&player){player.hasDrift=true;}
  if(d.cmd==='grant_stillness'&&player){player.hasStillness=true;}
  if(d.cmd==='spawn_enemy'&&gameState==='playing'){enemies.push(makeEnemy(d.type,d.x||W/2,d.y||-40));}
  if(d.cmd==='set_enemy_stat'&&EDEFS[d.type]){EDEFS[d.type][d.key]=+d.value;}
  if(d.cmd==='play_audio'){try{Aud[d.fn]?.(...(d.args||[]));}catch(_){}}
  if(d.cmd==='start_game'){if(gameState!=='playing'){Aud.boot();resetGameState();gameState='playing';initZone(1);spawnWave();}}
});

// Full game state tick to parent (design hub or cutscene editor)
setInterval(()=>{
  if(window.parent!==window){
    window.parent.postMessage({_csed:true,cmd:'tick',
      gameState,currentZone,zoneWave,score,frameCount,debugMode,bossSpawnTimer,
      player:player?{hp:player.hp,maxHp:player.maxHp,projectileLevel,shootRate:player.shootRate,
        hasDrift:player.hasDrift,hasStillness:player.hasStillness}:null,
      enemies:enemies.length,
      boss:boss?{hp:boss.hp,maxHp:boss.maxHp}:null,
      cutscene:{active:cutscene.active,type:cutscene.type,phase:cutscene.phase,timer:cutscene.timer}
    },'*');
  }
},100);
</script>

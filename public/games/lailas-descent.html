             height: min(94vh, calc(94vw * 780 / 560)); }

// ── zone constants ─────────────────────────────────────────────────────────────
const ZONE_WAVE_COUNTS = [0, 3, 5, 5, 3];
const ZONE_WAVE_DELAYS = [0, 150, 100, 85, 150];
const MH_RISE=70, MH_EXPOSE=210, MH_TELL=45, MH_SLAM=22, MH_STUN=25, MH_RECEDE=60;
const MH_PEAK=H*0.80;

// ── input ──────────────────────────────────────────────────────────────────────
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key===' ' && gameState==='intro' && INTRO_PHASES[introPhase].name==='start') startGamePlay();
  if (e.key==='Enter' && (gameState==='gameover'||gameState==='victory')) {
    if (gameState==='victory') {
      // True ending: the loop is broken. Feathers and falls are released.
      runCount=0; dreamFragmentLevel=0; lailaFree=true;
      localStorage.setItem('lailaRuns','0'); localStorage.setItem('lailaDreams','0');
      localStorage.setItem('lailaFree','1');
    }
    Aud.onDeath();
    introPhase=RUN_START_PHASE; introTimer=0; introPrevPhase=-1; gameState='intro';
  }
  // Skip repeat-run wake sequence straight to the start screen
  if ((e.key===' '||e.key==='Enter') && gameState==='intro'
      && INTRO_PHASES[introPhase].name!=='start' && introPhase>=RUN_START_PHASE) {
    introPhase=INTRO_PHASES.length-1; introTimer=0; introPrevPhase=INTRO_PHASES.length-1;
    Aud.introPhaseSound('start');
    keys[' ']=false;
    return;
  }
  // ── debug shortcuts (all gated behind god mode except the toggle itself) ──
  if (e.key==='`') debugMode=!debugMode; // backtick: toggle god mode
  if (debugMode && e.key==='Tab' && gameState==='playing'){e.preventDefault();// skip wave
    enemies=[];boss=null;waveDelay=1;}
  if (debugMode && e.key===']' && gameState==='playing') // boost projectile
    projectileLevel=Math.min(projectileLevel+1,3);
  if (debugMode && e.key==='[' && gameState==='playing') // grant abilities
    {player.hasDrift=true;player.hasStillness=true;}
  if (debugMode && e.key==='\\' && gameState==='playing') // skip zone
    {if(currentZone<4){zoneTransTimer=90;}}
  // ── pause / mute ──
  if ((e.key==='Escape'||e.key==='p'||e.key==='P') && (gameState==='playing')) {
    paused=!paused; Aud.setPaused(paused);
  }
  if (e.key==='m'||e.key==='M') Aud.toggleMute();
  // ── cutscene triggers (god mode only) ──
  if(debugMode && gameState==='playing'){
    if(e.key==='1'){cutscene.active=false;startCutscene('drowning');}
    if(e.key==='2'){cutscene.active=false;currentZone=2;startCutscene('transition_z3');}
    if(e.key==='3'){cutscene.active=false;currentZone=3;startCutscene('transition_z4');}
    if(e.key==='4'){cutscene.active=false;currentZone=4;boss=null;enemies=[];startCutscene('unchaining');}
    if(e.key==='5'){cutscene.active=false;currentZone=4;enemies=[];boss=null;startCutscene('true_ending');}
  }
});
addEventListener('keyup', e => { keys[e.key]=false; });
canvas.addEventListener('click', evt => {
  if (gameState==='intro' && INTRO_PHASES[introPhase].name==='start') {
    const rect=canvas.getBoundingClientRect();
    const cx=(evt.clientX-rect.left)*(W/rect.width);
    const cy=(evt.clientY-rect.top)*(H/rect.height);
    if(runCount>0&&cx>W/2-72&&cx<W/2+72&&cy>H/2+228&&cy<H/2+254){
      runCount=0;dreamFragmentLevel=0;
      localStorage.setItem('lailaRuns','0');localStorage.setItem('lailaDreams','0');
    }
    startGamePlay();
  }
});

  {name:'waking',  dur:440},{name:'why',     dur:320},{name:'start',  dur:99999},
];
const RUN_START_PHASE = 5;
// ── cinematic ASCII art assets — intentional full-frame designs ────────────────

// Laila — seated meditation (per-line colors: hair / eyes / skin / dress)
const LAILA_GRAND = [

const LAILA_GRAND_COLS = ['#ee2222','#ee2222','#ee2222','#44cc44','#f0d0a0','#f0eee8','#f0eee8','#f0eee8','#f0eee8'];
// Laila — rising (ending ascent: arms raised, eyes closed, serene)
const LAILA_RISE = [

const LAILA_SIT = ['   o   ','  (^)  ','  /|\\  ',' (___)  ']; // small distant figure
// ASCII crescent moon + mountain ridge (full-frame backgrounds stay in the medium)
const MOON_ASCII = [
  '    ,#### ',

  ' ###      ',
  ' ####     ',
  '  #####   ',
  '    `#### ',
];
const MTN_ASCII = [
  '          /\\                  /\\          ',
  '    /\\   /  \\       /\\      /  \\   /\\    ',
  '   /  \\ /    \\  /\\ /  \\    /    \\ /  \\   ',
  '  /    V      \\/  V    \\  /      V    \\  ',
  ' /                      \\/              \\ ',
];

// Per-line-colored ASCII renderer — the cinematic workhorse
function drawAsciiC(lines,colors,cx,cy,size=13,lh=17,alpha=1,glowCol=null,glowBlur=0){
  ctx.save();ctx.globalAlpha=alpha;ctx.font=`${size}px monospace`;ctx.textAlign='center';
  if(glowCol)glow(glowCol,glowBlur);
  const th=lines.length*lh;
  lines.forEach((l,i)=>{ctx.fillStyle=(colors&&colors[Math.min(i,colors.length-1)])||'#ffffff';ctx.fillText(l,cx,cy-th/2+i*lh+lh);});
  noGlow();ctx.restore();
}
// Full-frame drifting ASCII water/dust field — fills the screen with living texture
function drawAsciiField(alpha,t,density=110,col='#3a6a8a',drift=0.35){
  const chars=['~','≈','·','.',':','°'];
  ctx.save();ctx.font='11px monospace';ctx.textAlign='center';
  for(let i=0;i<density;i++){
    const x=12+((i*97)%28)*20;
    const y=(((i*53)%39)*20+t*drift+i*7)%(H+20)-10;
    ctx.globalAlpha=alpha*(0.10+0.10*Math.sin(i*1.7+t*0.03));
    ctx.fillStyle=col;
    ctx.fillText(chars[(i+Math.floor(t/40))%chars.length],x,y);
  }
  ctx.restore();ctx.globalAlpha=1;
}

// ── game state ─────────────────────────────────────────────────────────────────
let score, hi=0, waveDelay, gameState, dreamFragmentLevel=0;
let lailaFree=false, paused=false, playerFiredThisFrame=false;
let currentZone, zoneWave, bossSpawnTimer, frameCount, zoneTransTimer;
let midHand=null, midHandDone=false, z2HandSurge=0;
let debugMode=false;
let introPrevPhase=-1;
let cutscene={active:false,type:'',phase:0,timer:0,lailaY:0,lailaAngle:0,chainsDone:0,shadowY:0};
// Zone 2 breathe calls
let breatheCallTimer=0, breatheCallAlpha=0;
// Zone 3 fourth-wall events
let z3ev=null, z3LastWave=0, hudHpReversed=false, hudHpRevTimer=0;
// Screen flip (Zone 3 boss pre-event)
let screenFlipped=false, screenFlipTimer=0;
let zoneParticles=[], bgElements=[];
let player, bullets, eBullets, enemies, particles, drops, boss;
let projectileLevel;

function resetGameState() {
  score=0; waveDelay=0;
  currentZone=1; zoneWave=0; bossSpawnTimer=0; frameCount=0; zoneTransTimer=0;
  bullets=[]; eBullets=[]; enemies=[]; particles=[]; drops=[];

  cutscene.active=false; cutscene.type=''; cutscene.phase=0; cutscene.timer=0;

    x:W/2, y:H-110, w:28, h:38, spd:2.2,

  };
}

function startGamePlay() {
  resetGameState();
  Aud.boot();
  gameState='playing';
  initZone(1);
  spawnWave();
}

// ── audio ─────────────────────────────────────────────────────────────────────
const Aud = (() => {
  let ac = null, master = null, running = [];
  let bossGain = null;

  function boot() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
  }

  function stopAll() {
    const snap = running.splice(0);
    snap.forEach(n => { try { n.stop(ac.currentTime + 0.06); } catch(e) {} });
    if (bossGain) { try { bossGain.disconnect(); } catch(e) {} bossGain = null; }
  }

  function osc(type, freq, vol, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(dest || master); o.start();
    running.push(o); return { o, g };
  }

  function lfo(freq, depth, target) {
    const l = ac.createOscillator(), d = ac.createGain();
    l.frequency.value = freq; d.gain.value = depth;
    l.connect(d); d.connect(target); l.start(); running.push(l);
  }

  function noiseSrc(dest) {
    const len = ac.sampleRate * 5, buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    src.connect(dest || master); src.start(); running.push(src); return src;
  }

  function distCurve(amt) {
    const n = 256, c = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = (Math.PI + amt) * x / (Math.PI + amt * Math.abs(x)); }
    return c;
  }

  function fadeOut(cb, dur = 0.7) {
    if (!master) { stopAll(); if (cb) cb(); return; }
    master.gain.setTargetAtTime(0, ac.currentTime, dur / 4);
    setTimeout(() => { stopAll(); master.gain.cancelScheduledValues(ac.currentTime); master.gain.value = 0.5; if (cb) cb(); }, dur * 1000 + 100);
  }

  // Zone 1 — Still Water: detuned drones + deep lake pressure + wood creak + filtered water noise + distant owl
  function z1() {
    const d1 = osc('sine', 55, 0.20), d2 = osc('sine', 58.3, 0.13);
    osc('sine', 27.5, 0.09);
    lfo(0.035, 0.07, d1.g.gain); lfo(0.06, 0.05, d2.g.gain);
    // Deep lake pressure — sub-bass noise, barely moving
    const pf = ac.createBiquadFilter(); pf.type = 'lowpass'; pf.frequency.value = 75; pf.Q.value = 2.2;
    const pg = ac.createGain(); pg.gain.value = 0.030;
    noiseSrc(pf); pf.connect(pg); pg.connect(master); lfo(0.007, 10, pf.frequency);
    // Wood creak — occasional low sawtooth burst
    let creakAlive = true; running.push({ stop: () => { creakAlive = false; } });
    function woodCreak() {
      if (!creakAlive) return;
      const now = ac.currentTime;
      const co = ac.createOscillator(); co.type = 'sawtooth'; co.frequency.value = 52 + Math.random()*24;
      const cws = ac.createWaveShaper(); cws.curve = distCurve(22);
      const cf = ac.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 210; cf.Q.value = 2;
      const cg = ac.createGain(); cg.gain.setValueAtTime(0, now); cg.gain.linearRampToValueAtTime(0.028, now+0.18); cg.gain.setTargetAtTime(0, now+0.5, 0.18);
      co.connect(cws); cws.connect(cf); cf.connect(cg); cg.connect(master); co.start(now); co.stop(now+1.0);
      setTimeout(woodCreak, 5000 + Math.random()*10000);
    }
    woodCreak();
    const nf = ac.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 175; nf.Q.value = 1.8;
    const ng = ac.createGain(); ng.gain.value = 0.045;
    noiseSrc(nf); nf.connect(ng); ng.connect(master); lfo(0.015, 30, nf.frequency);
    // Distant owl — lowered to 390 Hz, two detuned sines beating slowly (gentle tension)
    const ovf = ac.createBiquadFilter(); ovf.type = 'bandpass'; ovf.frequency.value = 390; ovf.Q.value = 5;
    const ovg = ac.createGain(); ovg.gain.value = 0.048;
    const ov  = osc('sine', 390, 0, ovf); ovf.connect(ovg); ovg.connect(master);
    const ov2f = ac.createBiquadFilter(); ov2f.type = 'bandpass'; ov2f.frequency.value = 396; ov2f.Q.value = 5;
    const ov2g = ac.createGain(); ov2g.gain.value = 0.026;
    const ov2 = osc('sine', 396, 0, ov2f); ov2f.connect(ov2g); ov2g.connect(master); // beating ~6 Hz
    lfo(3.8, 3.5, ov.o.frequency); lfo(0.025, 0.032, ovg.gain);
    lfo(0.022, 0.025, ov2g.gain);
    // Sparse ambient melody — water-cave notes, very slow (one every 4-8s)
    let melAlive = true; running.push({ stop: () => { melAlive = false; } });
    const melRevDly = ac.createDelay(2.0); melRevDly.delayTime.value = 0.6;
    const melRevFbk = ac.createGain(); melRevFbk.gain.value = 0.30;
    const melRevWet = ac.createGain(); melRevWet.gain.value = 0.28; melRevWet.connect(master);
    melRevDly.connect(melRevFbk); melRevFbk.connect(melRevDly); melRevDly.connect(melRevWet);
    const melSeq = [146.8, 174.6, 220.0, 174.6, 146.8, 130.8, 146.8];
    let melIdx = 0;
    const schedZoneMelody = () => {
      if (!melAlive) return;
      const now = ac.currentTime, f = melSeq[melIdx % melSeq.length]; melIdx++;
      const mo = ac.createOscillator(); mo.type = 'sine'; mo.frequency.value = f;
      const mf = ac.createBiquadFilter(); mf.type = 'bandpass'; mf.frequency.value = f; mf.Q.value = 4;
      const mg = ac.createGain();
      mg.gain.setValueAtTime(0, now); mg.gain.linearRampToValueAtTime(0.032, now + 0.3);
      mg.gain.setTargetAtTime(0, now + 1.2, 0.55);
      mo.connect(mf); mf.connect(mg); mg.connect(master); mg.connect(melRevDly);
      mo.start(now); mo.stop(now + 3.0); running.push(mo);
      setTimeout(schedZoneMelody, 4200 + Math.random() * 4000);
    };
    setTimeout(schedZoneMelody, 1500);
  }

  // Zone 2 — The Hunger: Stoner/Doom — slow power chord riff, cavern reverb, deep sub-bass
  function z2() {
    // Deep doom sub-bass (D standard: 18.35, 36.7, 73.4 Hz)
    const d1 = osc('sine', 36.7, 0.22), d2 = osc('sine', 73.4, 0.13);
    osc('sine', 18.35, 0.09);
    lfo(0.04, 0.10, d1.g.gain); lfo(0.07, 0.05, d2.g.gain);
    // Power chord: D3(73.4) + A3(110) + D4(146.8) through heavy distortion
    const ws = ac.createWaveShaper(); ws.curve = distCurve(180);
    const rf = ac.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 1400;
    const gateG = ac.createGain(); gateG.gain.value = 0.001;
    [73.4, 110.0, 146.8].forEach(f => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      o.connect(ws); o.start(); running.push(o);
    });
    ws.connect(rf); rf.connect(gateG);
    // Long cavern reverb (0.65s delay, 40% feedback)
    const rg = ac.createGain(); rg.gain.value = 0.06;
    const dly = ac.createDelay(2.0); dly.delayTime.value = 0.65;
    const fbk = ac.createGain(); fbk.gain.value = 0.40;
    const wet = ac.createGain(); wet.gain.value = 0.35;
    dly.connect(fbk); fbk.connect(dly); rg.connect(dly); dly.connect(wet); wet.connect(master);
    gateG.connect(rg); rg.connect(master);
    // Doom strum rhythm — 65 BPM, slow and heavy
    let aliveZ2 = true; running.push({ stop: () => { aliveZ2 = false; } });
    const beatT2 = 60 / 65;
    let nextBeat2 = ac.currentTime + 0.8;
    function schedDoom() {
      if (!aliveZ2) return;
      while (nextBeat2 < ac.currentTime + 1.5) {
        gateG.gain.setValueAtTime(0.001, nextBeat2);
        gateG.gain.linearRampToValueAtTime(0.88, nextBeat2 + 0.035);
        gateG.gain.linearRampToValueAtTime(0.10, nextBeat2 + beatT2 * 0.82);
        nextBeat2 += beatT2;
      }
      setTimeout(schedDoom, 500);
    }
    schedDoom();
    // Cave rumble — low bandpass noise
    const bf = ac.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 160; bf.Q.value = 0.5;
    const bg = ac.createGain(); bg.gain.value = 0.025;
    noiseSrc(bf); bf.connect(bg); bg.connect(master);
    // Strained owl — strained, wavering
    const ovf = ac.createBiquadFilter(); ovf.type = 'bandpass'; ovf.frequency.value = 700; ovf.Q.value = 5;
    const ovg = ac.createGain(); ovg.gain.value = 0.09;
    const ov = osc('sine', 700, 0, ovf); ovf.connect(ovg); ovg.connect(master);
    lfo(5.5, 8, ov.o.frequency); lfo(0.04, 0.055, ovg.gain);
  }

  // Zone 3 — Between Channels: trance kick + hats + distorted power chord
  function z3() {
    let alive = true; running.push({ stop: () => { alive = false; } });
    const BPM = 128, beat = 60 / BPM;
    function kick(t) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(28, t + 0.08);
      g.gain.setValueAtTime(0.85, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.27);
    }
    function hat(t, vol) {
      const len = Math.floor(ac.sampleRate * 0.05), buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const hf = ac.createBiquadFilter(); hf.type = 'highpass'; hf.frequency.value = 8000;
      const hg = ac.createGain(); hg.gain.setValueAtTime(vol, t); hg.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      src.connect(hf); hf.connect(hg); hg.connect(master); src.start(t);
    }
    let next = ac.currentTime + 0.1, bar = 0;
    function sched() {
      if (!alive) return;
      while (next < ac.currentTime + 0.3) {
        kick(next); hat(next, bar % 4 === 0 ? 0.14 : 0.09); hat(next + beat * 0.5, 0.07);
        next += beat; bar++;
      }
      setTimeout(sched, 80);
    }
    sched();
    const ws = ac.createWaveShaper(); ws.curve = distCurve(150);
    const cf = ac.createBiquadFilter(); cf.type = 'lowpass'; cf.frequency.value = 1500;
    const cg = ac.createGain(); cg.gain.value = 0.055;

          const hLen=Math.floor(ac.sampleRate*0.04),hBuf=ac.createBuffer(1,hLen,ac.sampleRate),hD=hBuf.getChannelData(0);
          for(let j=0;j<hLen;j++)hD[j]=Math.random()*2-1;
          const hSrc=ac.createBufferSource();hSrc.buffer=hBuf;
          const hF=ac.createBiquadFilter();hF.type='highpass';hF.frequency.value=9500;
          const hGn=ac.createGain();hGn.gain.setValueAtTime(0.048,bt);hGn.gain.exponentialRampToValueAtTime(0.001,bt+0.025);
          hSrc.connect(hF);hF.connect(hGn);hGn.connect(mG);hSrc.start(bt);
          if(b%4===0||b%4===2){const ko=ac.createOscillator();ko.type='sine';ko.frequency.setValueAtTime(72,bt);ko.frequency.exponentialRampToValueAtTime(28,bt+0.12);const kg=ac.createGain();kg.gain.setValueAtTime(0.28,bt);kg.gain.exponentialRampToValueAtTime(0.001,bt+0.22);ko.connect(kg);kg.connect(mG);ko.start(bt);ko.stop(bt+0.28);}
        }
      }
      setTimeout(()=>schedLoop(t0+loopLen,loopN+1),loopLen*1000-120);
    }
    schedLoop(now+1.5,0);
  }

  return { boot, setZone, breathe, onDeath, victory, bossStart, bossEnd,
           sfxFire, sfxHit, sfxKill, sfxPlayerHit, sfxBossHit, introPhaseSound,

// ── zone init ──────────────────────────────────────────────────────────────────
function initZone(zone) {
  currentZone=zone; zoneWave=0; bossSpawnTimer=0;
  waveDelay=ZONE_WAVE_DELAYS[zone];
  enemies=[]; boss=null;
  breatheCallTimer=0; breatheCallAlpha=0;

function initZoneParticles(zone) {
  zoneParticles=[];
  if (zone===1) {
    for (let i=0;i<60;i++) zoneParticles.push({x:Math.random()*W,y:Math.random()*H,spd:0.08+Math.random()*0.28,r:0.4+Math.random()*1.1,a:0.06+Math.random()*0.18,kind:'sediment'});
  } else if (zone===2) {
    // Embers — layered depth: fast/large/bright (close) vs slow/small/dim (far)
    for (let i=0;i<75;i++){
      const depth=Math.random(); // 0=far, 1=close
      zoneParticles.push({x:Math.random()*W,y:Math.random()*H,
        spd:0.06+depth*0.55+Math.random()*0.2,
        r:0.3+depth*1.8+Math.random()*0.5,
        a:0.03+depth*0.16+Math.random()*0.05,
        kind:'ember',phase:Math.random()*Math.PI*2,warm:Math.random()});
    }
  } else if (zone===3) {
    // Neon static — tiny, barely moving, flickering in zone colors
    const nc=['#ff6600','#cc00ff','#00ccff','#ff0099','#ffff00'];
    for (let i=0;i<45;i++) zoneParticles.push({x:Math.random()*W,y:Math.random()*H,
      spd:0.02+Math.random()*0.06,r:0.3+Math.random()*0.7,
      a:0.04+Math.random()*0.09,kind:'neonstat',
      phase:Math.random()*Math.PI*2,col:nc[Math.floor(Math.random()*nc.length)]});
  } else if (zone===4) {
    // Void dust — layered depth, some drifting up, some barely moving
    for (let i=0;i<22;i++){
      const depth=Math.random();
      zoneParticles.push({x:Math.random()*W,y:Math.random()*H,
        spd:0.02+depth*0.10+Math.random()*0.04,
        r:0.3+depth*2.2+Math.random()*0.4,
        a:0.03+depth*0.10+Math.random()*0.04,
        kind:'void',phase:Math.random()*Math.PI*2,
        dir:Math.random()>0.6?-1:1}); // most drift down, some up
    }
  }
}

function initZoneBgElements(zone) {
  bgElements=[];
  if (zone===1) {
    for (let i=0;i<22;i++) bgElements.push({type:'stick',x:Math.random()*W,y:Math.random()*H,len:12+Math.random()*28,angle:(Math.random()-0.5)*1.2,vy:0.18+Math.random()*0.42,vx:(Math.random()-0.5)*0.15,opacity:0.18+Math.random()*0.42});
    bgElements.push({type:'frog',x:-120,y:H*0.65,vx:0,active:false,timer:900+Math.random()*800});
  } else if (zone===2) {

    bgElements.push({type:'reflection',x:W/2,y:H/2,opacity:0,timer:900+Math.random()*300,active:false,lingering:false});
    // The puppetmaster's hands — foggy silhouettes at the edges, creeping closer
    [{side:'L',by:H*0.22,sc:1.6,ph:0.0,dp:0.9},{side:'R',by:H*0.55,sc:2.1,ph:1.7,dp:1.0},
     {side:'L',by:H*0.62,sc:1.3,ph:3.1,dp:0.7},{side:'R',by:H*0.18,sc:1.5,ph:4.4,dp:0.8},

     {side:'R',by:H*0.78,sc:1.4,ph:0.9,dp:0.75},{side:'B',by:0,   sc:1.7,ph:3.8,dp:0.85}]
      .forEach(h=>bgElements.push({type:'pmhand',...h}));
  } else if (zone===4) {
    // Chains at varied angles and scales
  [{x:60,angle:-0.15,len:0.55,scale:1.4},{x:160,angle:0.35,len:0.45,scale:0.6},{x:270,angle:-0.05,len:0.65,scale:1.1},{x:370,angle:0.55,len:0.38,scale:0.45},{x:450,angle:-0.28,len:0.50,scale:0.9},{x:530,angle:0.12,len:0.60,scale:1.3},{x:110,angle:0.7,len:0.40,scale:0.5},{x:420,angle:-0.6,len:0.42,scale:0.7}].forEach(c=>bgElements.push({type:'vchain',...c}));

function updateZoneParticles() {
  zoneParticles.forEach(p => {
    if (p.kind==='geoflash') { p.life-=0.03; return; }
    if (p.kind==='sediment') {
      p.y-=p.spd; if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}
    } else if (p.kind==='intro') {
      p.y+=p.spd; if(p.y>H+6){p.y=-6;p.x=Math.random()*W;}
    } else if (p.kind==='ember') {
      // Gentle sine drift — larger particles drift more (close = more turbulence)
      p.x+=Math.sin(frameCount*0.014+(p.phase||0))*(0.15+p.r*0.12);
      p.y-=p.spd;
      if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}
    } else if (p.kind==='neonstat') {
      p.y-=p.spd;
      p.x+=Math.sin(frameCount*0.01+p.phase)*0.08;
      if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}
    } else if (p.kind==='void') {
      p.y+=p.spd*(p.dir||1);// some drift down, some up
      p.x+=Math.sin(frameCount*0.006+p.phase)*0.06;
      if(p.y>H+6){p.y=-6;p.x=Math.random()*W;}
      if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}
    }
  });
  if (currentZone===3) zoneParticles=zoneParticles.filter(p=>p.kind!=='geoflash'||p.life>0);
}

function updateBgElements() {
  bgElements.forEach(el => {
    if (el.type==='stick') {
      el.y+=el.vy; el.x+=el.vx;
      if (el.y>H+30) {el.y=-30;el.x=Math.random()*W;}
    } else if (el.type==='frog') {
      el.timer--;
      if (!el.active&&el.timer<=0) {el.active=true;el.x=-80;el.y=H*0.55+Math.random()*H*0.2;el.vx=0.4+Math.random()*0.3;el.timer=1200+Math.random()*1200;}
      if (el.active) {el.x+=el.vx; if(el.x>W+100)el.active=false;}
    } else if (el.type==='face') {
      el.timer--;
      if (el.phase==='idle'&&el.timer<=0) {el.phase='appear';el.opacity=0;el.timer=40;}
      else if (el.phase==='appear') {
        el.opacity=Math.min(0.1,el.opacity+0.003); el.timer--;
        if (el.timer<=0) {el.phase='idle';el.opacity=0;el.timer=400+Math.random()*600;el.x=80+Math.random()*400;el.y=100+Math.random()*500;}
      }
    } else if (el.type==='reflection') {
      el.timer--;
      if (!el.active&&el.timer<=0) {
        el.active=true;el.opacity=0;el.timer=90;
        el.x=player.x+(Math.random()>0.5?60:-60);
        el.y=player.y+(Math.random()-0.5)*40;
        el.lingering=Math.random()>0.6;
      }
      if (el.active) {
        el.timer--;
        if (el.timer>60) el.opacity=Math.min(0.14,el.opacity+0.012);
        else if (!el.lingering) el.opacity=Math.max(0,el.opacity-0.006);
        else if (el.timer<20) el.opacity=Math.max(0,el.opacity-0.012);
        if (el.timer<=0) {el.active=false;el.opacity=0;el.timer=900+Math.random()*600;}
      }
    } else if (el.type==='root') {
      if (el.currentHeight<el.height) el.currentHeight+=el.growthRate;
    }
  });
}

function makeEnemy(type,x,y){

// ── wave spawning ──────────────────────────────────────────────────────────────
// Stationary / near-still enemies must spawn INSIDE the arena — anything parked
// above y=-10 can never be hit (bullet cull) and silently blocks wave-clear.
function spawnPos(type,pad){
  switch(type){
    case 'signal':   return {x:pad+40+Math.random()*(W-pad*2-80), y:110+Math.random()*H*0.30};
    case 'lakemoss': return {x:pad+Math.random()*(W-pad*2),       y:70+Math.random()*H*0.35};
    case 'glitch':   return {x:pad+Math.random()*(W-pad*2),       y:90+Math.random()*H*0.40};
    case 'decoy':    return {x:128+Math.random()*54,              y:16+Math.random()*12}; // hides at the HUD feather line
    case 'root':     return {x:pad+Math.random()*(W-pad*2),       y:H-8};  // anchored to the lake bed
    case 'chain':    return {x:pad+80+Math.random()*(W-pad*2-160),y:-12};  // hung from the dark above
    default:         return {x:pad+Math.random()*(W-pad*2),       y:-40-Math.random()*80};
  }
}
function spawnWave(){
  zoneWave++;
  if(currentZone===2)z2HandSurge=120; // the hands stir at every new wave
  const pad=60,wc=ZWC[currentZone][Math.min(zoneWave-1,ZWC[currentZone].length-1)];
  wc.forEach(({t,n})=>{for(let i=0;i<n;i++){const p=spawnPos(t,pad);enemies.push(makeEnemy(t,p.x,p.y));}});
  // Difficulty scaling: extra enemy after 5+ deaths
  if(runCount>5&&currentZone<4){
    const pool=ZWC[currentZone];const extras=pool[Math.floor(Math.random()*pool.length)];
    const p=spawnPos(extras[0].t,pad);
    enemies.push(makeEnemy(extras[0].t,p.x,p.y));
  }
}

// ── particles ──────────────────────────────────────────────────────────────────
function burst(x,y,col,n=14,spd=4){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=0.5+Math.random()*spd;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:0.010+Math.random()*0.016,col,r:1.5+Math.random()*3});}
}
function spawnGeoFlash(x,y){
  const cols=['#ff6600','#cc00ff','#ffff00','#ff0099','#00ccff'];
  zoneParticles.push({kind:'geoflash',x,y,r:15+Math.random()*25,life:1,col:cols[Math.floor(Math.random()*cols.length)],shape:Math.random()>0.5?'triangle':'circle'});
}

// ── collision ──────────────────────────────────────────────────────────────────
function hit(ax,ay,aw,ah,bx,by,bw,bh){return ax-aw/2<bx+bw/2&&ax+aw/2>bx-bw/2&&ay-ah/2<by+bh/2&&ay+ah/2>by-bh/2;}

// ── boss ───────────────────────────────────────────────────────────────────────
function spawnZoneBoss(){
  const bases={1:{w:180,h:130,hp:30,score:400},2:{w:200,h:150,hp:55,score:600},3:{w:160,h:120,hp:70,score:800},4:{w:140,h:110,hp:100,score:1200}};
  const b=bases[currentZone];
  boss={x:W/2,y:-b.h-20,w:b.w,h:b.h,hp:b.hp,maxHp:b.hp,phase:1,score:b.score,
        fireCD:80,driftDir:1,driftSpd:0.5,
        // zone-specific state
        beamActive:false,beamX:0,beamDir:1,beamTimer:0,beamTelegraph:0,
        swoopActive:false,swoopT:0,swoopSX:0,swoopSY:0,swoopEX:0,swoopEY:0,
        fragments:currentZone===3?initFragments():[],
        breatheText:0};
  Aud.bossStart(currentZone);
}

function initFragments(){
  return[
    {type:'leftWing', x:W*0.18,y:160,hp:18,fireCD:120,active:true},
    {type:'rightWing',x:W*0.82,y:160,hp:18,fireCD:160,active:true},
    {type:'eye',      x:W/2,   y:110,hp:18,fireCD:100,active:true},
    {type:'body',     x:W/2,   y:230,hp:16,fireCD:145,active:true,pulseTimer:0},
  ];
}

function updateBoss(){
  if(!boss)return;
  // Entry descent
  if(boss.y<100){boss.y+=0.8;return;}
  if(boss.fireCD>0)boss.fireCD--;

  if(currentZone===1)      updateBoss_owlDistant();
  else if(currentZone===2) updateBoss_owlUrgent();
  else if(currentZone===3) updateBoss_owlFragmented();
  else                     updateBoss_shadow();

  // Universal bullet collision
  bullets=bullets.filter(b=>{
    if(!boss)return true;
    const target=currentZone===3?null:boss;
    if(target&&hit(b.x,b.y,b.r*2,b.r*2,boss.x,boss.y,boss.w*0.8,boss.h*0.8)){
      burst(b.x,b.y,'#ffffff',5,2.5);boss.hp-=(b.damage||1);Aud.sfxBossHit();
      if(boss.hp<=0){onBossDefeated();return false;}
      return false;
    }
    // Fragment collision for Zone 3
    if(currentZone===3&&boss){
      for(const fr of boss.fragments){
        if(!fr.active)continue;
        if(hit(b.x,b.y,b.r*2,b.r*2,fr.x,fr.y,60,50)){
          burst(b.x,b.y,'#cc00ff',5,2);fr.hp-=(b.damage||1);boss.hp-=(b.damage||1);
          if(fr.hp<=0){fr.active=false;burst(fr.x,fr.y,'#cc00ff',20,4);}
          if(boss.hp<=0){onBossDefeated();return false;}
          return false;
        }
      }
    }
    return true;
  });
  if(!boss)return;
  // Contact with boss body (Zone 3: fragments only — there is no central body)
  if(player.iframes<=0&&boss){
    if(currentZone===3){
      for(const fr of boss.fragments){
        if(fr.active&&hit(player.x,player.y,player.w,player.h,fr.x,fr.y,52,42)){damagePlayer();break;}
      }
    } else if(hit(player.x,player.y,player.w,player.h,boss.x,boss.y,boss.w*0.55,boss.h*0.55))damagePlayer();
  }
}

function updateBoss_owlDistant(){
  const b=boss;
  b.x+=b.driftDir*b.driftSpd*0.7;
  if(b.x<b.w/2+30||b.x>W-b.w/2-30)b.driftDir*=-1;
  if(b.hp<=b.maxHp*0.5&&b.phase===1){b.phase=2;b.breatheText=180;b.driftSpd=1.1;}
  // Beam attack
  if(!b.beamActive){
    b.beamTelegraph--;
    if(b.beamTelegraph<=0){
      b.beamActive=true;b.beamX=b.driftDir>0?0:W;b.beamDir=b.driftDir>0?1:-1;
      b.beamTimer=b.phase===2?55:80;b.beamTelegraph=b.phase===2?160:220;
    }
  } else {
    b.beamX+=b.beamDir*(W/b.beamTimer);b.beamTimer--;
    const bh=b.phase===2?8:13;
    // Damage player only inside the swept region of the beam
    const inBeamX=b.beamDir>0?player.x<=b.beamX:player.x>=b.beamX;
    if(player.iframes<=0&&inBeamX&&Math.abs(player.y-(b.y+b.h*0.3))<bh+10&&b.beamTimer>0)damagePlayer();
    if(b.beamTimer<=0)b.beamActive=false;
  }
  // Cold orbs
  if(b.fireCD<=0){eBullets.push({x:b.x+(Math.random()-0.5)*80,y:b.y+b.h*0.4,vx:(Math.random()-0.5)*0.4,vy:1.1,col:'#88ccee',r:5});b.fireCD=b.phase===2?110:155;}
  if(b.breatheText>0)b.breatheText--;
}

function updateBoss_owlUrgent(){
  const b=boss;
  if(b.hp<=b.maxHp*0.4&&b.phase===1){
    b.phase=2;b.breatheText=200;
    // Dissolve hands
    enemies=enemies.filter(e=>e.type!=='hand');
    eBullets=[];
  }
  if(!b.swoopActive){
    b.x+=b.driftDir*b.driftSpd;
    if(b.x<b.w/2+20||b.x>W-b.w/2-20){b.driftDir*=-1;}
    // A rushing shadow crosses the path before the owl commits — read it
    if(b.fireCD===40){
      b.swoopSX=b.x;b.swoopSY=b.y;
      b.swoopEX=b.x<W/2?W+60:-60;b.swoopEY=b.y+(Math.random()-0.5)*80;
      b.shadowTele=40;
    }
    if(b.shadowTele>0)b.shadowTele--;
    if(b.fireCD<=0){
      b.swoopActive=true;b.swoopT=0;b.shadowTele=0;
      b.fireCD=b.phase===2?150:200;
    }
  } else {
    b.swoopT+=b.phase===2?0.028:0.022;
    const t=b.swoopT,mx=W/2,my=player.y-40;
    b.x=b.swoopSX*(1-t)**2+2*mx*t*(1-t)+b.swoopEX*t**2;
    b.y=b.swoopSY*(1-t)**2+2*my*t*(1-t)+b.swoopEY*t**2;
    // Feather burst at mid-swoop — feathers slow and LINGER, drifting down
    if(t>0.45&&t<0.55&&!b.burstFired){
      b.burstFired=true;
      const n=b.phase===2?8:12;
      for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2;eBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*1.7,vy:Math.sin(a)*1.7,col:'#ffe8a0',r:4.5,feather:true,age:0});}
    }
    if(b.swoopT>=1){b.swoopActive=false;b.burstFired=false;b.y=Math.min(b.y,160);}
  }
  if(b.breatheText>0)b.breatheText--;
}

// The Fragmented Owl — a broken broadcast. Only ONE fragment is live at a
// time; a static burst announces every channel switch. Learn to watch the
// signal, not the pieces. Phase 2: all channels open at once, then the slam.
function updateBoss_owlFragmented(){
  const b=boss;
  const allDead=b.fragments.every(f=>!f.active);
  if(allDead){onBossDefeated();return;}
  if(b.hp<=b.maxHp*0.35&&b.phase===1){b.phase=2;b.breatheText=120;}
  // Channel switching (phase 1 only — phase 2 is full chaos)
  if(b.phase===1){
    b.chTimer=(b.chTimer||0)-1;
    if(b.chStatic>0)b.chStatic--;
    if(b.chTimer<=0){
      const live=b.fragments.filter(f=>f.active);
      b.liveIdx=(b.liveIdx===undefined?0:b.liveIdx+1)%live.length;
      b.liveFrag=live[b.liveIdx];
      b.chStatic=20; // the static burst — channel change incoming
      b.chTimer=150;
    }
  }
  b.fragments.forEach(fr=>{
    if(!fr.active)return;
    if(fr.fireCD>0)fr.fireCD--;
    const isLive=b.phase===2||fr===b.liveFrag;
    fr.live=isLive;
    // Movement always; fire only on the live channel
    if(fr.type==='leftWing'){fr.x=W*0.18+Math.sin(frameCount*0.022)*60;fr.y=150+Math.sin(frameCount*0.015)*30;if(isLive&&fr.fireCD<=0&&!b.chStatic){eBullets.push({x:fr.x,y:fr.y,vx:0.8,vy:1.2,col:'#cc00ff',r:4});fr.fireCD=b.phase===2?80:55;}}
    else if(fr.type==='rightWing'){fr.x=W*0.82+Math.sin(frameCount*0.018+2)*60;fr.y=155+Math.sin(frameCount*0.013+1)*28;if(isLive&&fr.fireCD<=0&&!b.chStatic){eBullets.push({x:fr.x,y:fr.y,vx:-0.8,vy:1.2,col:'#cc00ff',r:4});fr.fireCD=b.phase===2?85:58;}}
    else if(fr.type==='eye'){fr.x=W/2+Math.sin(frameCount*0.014)*45;fr.y=120+Math.sin(frameCount*0.02)*25;if(isLive&&fr.fireCD<=0&&!b.chStatic){fireAt({x:fr.x,y:fr.y},player.x,player.y);eBullets[eBullets.length-1].col='#ff00ff';fr.fireCD=b.phase===2?90:62;}}
    else if(fr.type==='body'){fr.body_t=(fr.body_t||0)+0.01;fr.x=W/2;fr.y=230+Math.sin(fr.body_t)*15;fr.pulseTimer=(fr.pulseTimer||0)+1;if(isLive&&fr.pulseTimer%(b.phase===2?130:85)===0&&!b.chStatic){for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;eBullets.push({x:fr.x,y:fr.y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,col:'#ff44ff',r:4});}}  }
  });
  // Phase 2: slam together (breatheText decremented once, below)
  if(b.phase===2){const prog=Math.max(0,b.breatheText/120);b.fragments.forEach(fr=>{if(!fr.active)return;fr.x=fr.x*(prog)+(W/2)*(1-prog);fr.y=fr.y*(prog)+(180)*(1-prog);});}
  b.x=W/2;b.y=180;// boss center reference (contact is per-fragment)
  if(b.breatheText>0)b.breatheText--;
}

// The Shadow — the trial. She mirrors Laila's movement, and her weapon is
// LAILA'S weapon, returned dark: when you fire, she answers with the shadow
// of your current projectile. At the end she stops fighting entirely and
// walks toward you. The last blow is a decision.
function shadowFire(b){
  const lv=projectileLevel;
  const ang=Math.atan2(player.y-b.y,player.x-b.x);
  if(lv===2){ // dark moonlight — a fan, like yours
    [-0.3,0,0.3].forEach(off=>eBullets.push({x:b.x,y:b.y,vx:Math.cos(ang+off)*2.2,vy:Math.sin(ang+off)*2.2,col:'#0a3322',r:5,dark:2}));
  } else if(lv===3){ // the void, answered
    eBullets.push({x:b.x,y:b.y,vx:Math.cos(ang)*1.7,vy:Math.sin(ang)*1.7,col:'#001a10',r:10,dark:3});
  } else if(lv===1){ // a dark feather — fast
    eBullets.push({x:b.x,y:b.y,vx:Math.cos(ang)*3.1,vy:Math.sin(ang)*3.1,col:'#0a2a1a',r:4,dark:1});
  } else { // a black bubble
    eBullets.push({x:b.x,y:b.y,vx:Math.cos(ang)*2.3,vy:Math.sin(ang)*2.3,col:'#0a3322',r:4.5,dark:0});
  }
}
function updateBoss_shadow(){
  const b=boss;
  const frac=b.hp/b.maxHp;
  if(frac<=0.5&&b.phase===1)b.phase=2;
  // The walk — below 10% she stops attacking and simply comes to you
  if(frac<=0.10){
    b.walking=true;
    const a=Math.atan2(player.y-b.y,player.x-b.x);
    b.x+=Math.cos(a)*0.45;b.y+=Math.sin(a)*0.45;
    if(player.iframes<=0&&hit(player.x,player.y,player.w,player.h,b.x,b.y,b.w*0.4,b.h*0.4))damagePlayer();
    return;
  }
  // Mirrors Laila's movement with lag
  b.x+=(player.x-b.x)*0.035;
  b.y=Math.min(b.y,H-220);
  // Your fire, echoed back a beat later
  b.idleT=(b.idleT||0)+1;
  if(b.echoDelay>0){b.echoDelay--;if(b.echoDelay===0)shadowFire(b);}
  if(playerFiredThisFrame&&!b.echoDelay&&b.fireCD<=0){b.echoDelay=14;b.fireCD=b.phase===2?30:46;b.idleT=0;}
  // She does not wait forever for a pacifist
  if(b.idleT>180&&b.fireCD<=0){shadowFire(b);b.fireCD=b.phase===2?30:46;b.idleT=0;}
  // Phase 2: she dashes THROUGH you, leaving afterimages
  if(b.phase===2&&!b.dashT&&frameCount%220===0){
    b.dashT=18;b.dashA=Math.atan2(player.y-b.y,player.x-b.x);b.trail=[];
  }
  if(b.dashT>0){
    b.dashT--;
    (b.trail=b.trail||[]).push({x:b.x,y:b.y,a:0.5});
    b.x+=Math.cos(b.dashA)*9;b.y+=Math.sin(b.dashA)*9;
    b.x=Math.max(b.w/2,Math.min(W-b.w/2,b.x));b.y=Math.max(90,Math.min(H-140,b.y));
  }
  if(b.trail){b.trail.forEach(tp=>tp.a*=0.93);b.trail=b.trail.filter(tp=>tp.a>0.03);}
}

function onBossDefeated(){
  if(!boss)return;
  score+=boss.score;burst(boss.x,boss.y,'#ffffff',50,6);
  if(currentZone===2)player.hasStillness=true;
  // Design 1.5: boss kill guarantees one projectile stage advance
  if(currentZone<4&&projectileLevel<3){projectileLevel++;burst(player.x,player.y,'#ffffff',16,3);}
  Aud.bossEnd();
  boss=null;
  if(currentZone===1)     startCutscene('drowning');
  else if(currentZone===2)startCutscene('transition_z3');
  else if(currentZone===3)startCutscene('transition_z4');
  else                   {startCutscene('true_ending');Aud.tePhaseSound(0);Aud.teEndingMusic();}
}

function startCutscene(type){
  cutscene.active=true;cutscene.type=type;cutscene.phase=0;cutscene.timer=0;
  cutscene.lailaY=player.y;cutscene.lailaAngle=0;cutscene.chainsDone=0;cutscene.shadowY=H+60;
  enemies=[];eBullets=[];
}

// ── Zone 2 mid-zone hand event ─────────────────────────────────────────────────
function triggerMidHand(){
  midHand={x:W/2,y:H+240,phase:'rising',timer:0,
           hp:4,maxHp:4,slamX:W/2,curlProgress:0,flashTimer:0,hitPlayer:false};
}

function updateMidHand(){
  if(!midHand)return;
  const m=midHand;
  m.timer++;
  if(m.flashTimer>0)m.flashTimer--;

  if(m.phase==='rising'){
    const t=m.timer/MH_RISE;
    m.y=H+240-(H+240-MH_PEAK)*(1-Math.pow(1-Math.min(t,1),3)); // ease-out cubic
    m.x+=(player.x-m.x)*0.018;
    if(m.timer>=MH_RISE){m.phase='exposed';m.timer=0;}

  }else if(m.phase==='exposed'){
    m.x+=(player.x-m.x)*0.014;
    m.x=Math.max(100,Math.min(W-100,m.x));
    if(m.timer>=MH_EXPOSE){m.slamX=m.x;m.phase='telegraphing';m.timer=0;}

  }else if(m.phase==='telegraphing'){
    m.curlProgress=m.timer/MH_TELL;
    if(m.timer>=MH_TELL){m.phase='slamming';m.timer=0;m.hitPlayer=false;}

  }else if(m.phase==='slamming'){
    const t=m.timer/MH_SLAM;
    m.y=MH_PEAK+(H+120-MH_PEAK)*t*t; // quad ease-in: accelerates downward
    m.x=m.slamX;
    if(!m.hitPlayer&&player.iframes<=0&&!player.stillnessActive){
      const fistY=m.y-44;
      if(Math.abs(fistY-player.y)<72&&Math.abs(m.x-player.x)<90){damagePlayer();m.hitPlayer=true;}
    }
    if(m.timer>=MH_SLAM){m.phase='stun';m.timer=0;}

  }else if(m.phase==='stun'){
    if(m.timer>=MH_STUN){m.phase='retreating';m.timer=0;}

  }else if(m.phase==='retreating'){
    const t=m.timer/MH_RECEDE;
    m.y=(H+120)+120*t*t; // ease-in: accelerates away
    if(m.timer>=MH_RECEDE){midHand=null;midHandDone=true;waveDelay=ZONE_WAVE_DELAYS[currentZone];}
  }
}

function killMidHand(){
  burst(midHand.x,midHand.y-220,'#ff4400',30,6);
  burst(midHand.x,midHand.y-160,'#ff8800',20,4);
  score+=150;
  drops.push({x:midHand.x,y:midHand.y-180,kind:'heal'});
  midHand=null;midHandDone=true;
  waveDelay=ZONE_WAVE_DELAYS[currentZone];
}

// ── enemy behavior ─────────────────────────────────────────────────────────────
// ── per-enemy update handlers ─────────────────────────────────────────────────
// Rotwood — waterlogged log. Drifts with the current; when something passes
// beneath, it tilts (the wind-up) and rolls sideways across the water.
// The only horizontal threat in a vertical zone.
function updateEnemy_rotwood(e,s){
  if(s.swayPhase===undefined)s.swayPhase=Math.random()*Math.PI*2;
  s.state=s.state||'drift';s.t=(s.t||0)+1;s.angle=s.angle||0;
  if(s.state==='drift'){
    e.y+=e.spd;e.x+=Math.sin(frameCount*0.01+s.swayPhase)*0.3;
    s.angle=Math.sin(frameCount*0.008+s.swayPhase)*0.12;
    s.cd=(s.cd||0)-1;
    if(s.cd<=0&&e.y>60&&e.y<player.y-90&&Math.abs(e.x-player.x)<130){s.state='tilt';s.t=0;}
  } else if(s.state==='tilt'){
    // tilts up against the roll direction — readable wind-up (~0.85s)
    const target=player.x>e.x?-0.55:0.55;
    s.angle+=(target-s.angle)*0.07;
    e.y+=e.spd*0.3;
    if(s.t>=50){s.state='roll';s.t=0;s.rollDir=player.x>e.x?1:-1;}
  } else if(s.state==='roll'){
    e.x+=s.rollDir*2.4;e.y+=0.7;
    s.angle+=s.rollDir*0.22; // tumbling across the frame
    if(s.t>=70||e.x<e.w/2+6||e.x>W-e.w/2-6){s.state='drift';s.cd=260;}
  }
}
// Deep Light — the cold lure. Drawn toward warmth; its pulse quickens as it
// closes in. The pulse IS the countdown. Killed from range, it dies quietly.
function updateEnemy_deeplight(e,s){
  const dx=player.x-e.x,dy=player.y-e.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
  e.x+=dx/dd*0.26+Math.sin(frameCount*0.04+s.driftPhase)*0.5;
  e.y+=dy/dd*0.20+e.spd*0.4;
  s.pulse=(s.pulse||0)+0.05+Math.max(0,240-dd)*0.0011; // quickens with proximity
  if(dd<55&&!s.detonated){s.detonated=true;for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,col:'#88ccff',r:3});}burst(e.x,e.y,'#88ccff',10,3);score+=e.score;e.dead=true;}
}
// Lake Moss — camouflaged ambusher. Notices you, shivers (the tell), then
// blooms a spore field that LINGERS — area denial that forces re-routing.
function updateEnemy_lakemoss(e,s){
  e.y+=e.spd;
  if(s.cooldown>0)s.cooldown--;
  const dl=Math.sqrt((e.x-player.x)**2+(e.y-player.y)**2);
  if(!s.bloomed&&!s.shiver&&!s.cooldown&&dl<95)s.shiver=25;
  if(s.shiver>0){s.shiver--;if(s.shiver<=0){s.bloomed=true;s.bloomTimer=240;}}
  if(s.bloomed){
    s.bloomR=Math.min(75,(s.bloomR||0)+2.8);
    s.bloomTimer--;
    if(Math.sqrt((e.x-player.x)**2+(e.y-player.y)**2)<s.bloomR)player.slowTimer=Math.max(player.slowTimer,35);
    if(s.bloomTimer<=0){s.bloomed=false;s.bloomR=0;s.cooldown=140;}
  }
}
// The Hand — approach, SPLAY (fingers spread wide: the grab is coming),
// snap-lunge, then hang LIMP — the miss leaves it open. Risk/reward timing.
function updateEnemy_hand(e,s){
  s.size=1+zoneWave*0.18;
  s.state=s.state||'approach';s.t=(s.t||0)+1;
  if(s.state==='approach'){
    const hdx=player.x-e.x,hdy=player.y-e.y,hd=Math.sqrt(hdx*hdx+hdy*hdy)||1;
    e.x+=hdx/hd*0.45;e.y+=hdy/hd*0.35+e.spd*0.4;
    if(hd<260&&s.t>40){s.state='splay';s.t=0;}
  } else if(s.state==='splay'){
    e.y+=0.15; // half-second of open fingers — read it
    if(s.t>=30){s.state='lunge';s.t=0;const a=Math.atan2(player.y-e.y,player.x-e.x);s.lungeVx=Math.cos(a)*3.6;s.lungeVy=Math.sin(a)*3.6;}
  } else if(s.state==='lunge'){
    e.x+=s.lungeVx;e.y+=s.lungeVy;
    if(s.t>=24){s.state='limp';s.t=0;}
  } else if(s.state==='limp'){
    e.y+=0.5; // spent — drifts, exposed. The punish window.
    if(s.t>=38){s.state='approach';s.t=0;}
  }
}
// The Seeker — it watches. The pupil tracks you always; it fires only when it
// BLINKS. Closed eyes mean the shot is coming. Inverted telegraph.
function updateEnemy_seeker(e,s){
  e.x+=(player.x-e.x)*0.005;e.y+=e.spd*(s.blink>0?0.2:1);
  s.watch=(s.watch||0)+1;
  const aligned=Math.abs(e.x-player.x)<70&&player.y>e.y;
  if(!s.blink&&e.y>30&&(s.watch>200||(aligned&&s.watch>90))&&!player.stillnessActive)s.blink=22;
  if(s.blink>0){
    s.blink--;
    if(s.blink===0){fireAt(e,player.x,player.y);eBullets[eBullets.length-1].col='#ffaa20';s.watch=0;}
  }
}
// Hand Cluster — grasping surges. A clutching rhythm: straight dodgeable
// surge, then an open-handed pause where it spreads wider. Choke on contact.
function updateEnemy_handcluster(e,s){
  s.state=s.state||'pause';s.t=(s.t||0)+1;
  const cdx=player.x-e.x,cdy=player.y-e.y,cd=Math.sqrt(cdx*cdx+cdy*cdy)||1;
  if(s.state==='pause'){
    e.x+=cdx/cd*0.25;e.y+=cdy/cd*0.25; // hangs open, drifting closer
    if(s.t>=35){s.state='surge';s.t=0;s.sx=cdx/cd;s.sy=cdy/cd;}
  } else {
    e.x+=s.sx*2.7;e.y+=s.sy*2.7; // committed straight clutch — sidestep it
    if(s.t>=40){s.state='pause';s.t=0;}
  }
  if(cd<32&&player.iframes<=0&&!s.choking){s.choking=true;player.chokeTimer=60;e.x-=cdx/cd*30;e.y-=cdy/cd*30;}
  if(s.choking&&player.chokeTimer<=0)s.choking=false;
}
// The Reflection — your violence, returned. She mirrors your movement on a
// delay and fires ONLY when you fire while your lines cross. Shooting near
// her is the risk.
function updateEnemy_reflection(e,s){
  if(s.respawnTimer>0){s.respawnTimer--;e.y=-200;return;} // park above screen (below-screen cull would delete it)
  s.history.push({x:player.x,y:player.y});if(s.history.length>45)s.history.shift();
  if(s.history.length>0){const ph=s.history[0];e.x=W-ph.x+W*0.1;e.y=ph.y;}
  if(e.fireCD>0)return;
  if(playerFiredThisFrame&&Math.abs(e.x-player.x)<36&&e.y>0){fireAt(e,player.x,player.y);eBullets[eBullets.length-1].col='#6688aa';e.fireCD=30;}
}
// The Glitch — corruption you learn to read. RGB static builds at the
// destination BEFORE it materializes; the shot comes a beat after it lands.
function updateEnemy_glitch(e,s){
  s.teleTimer--;
  if(s.fireDelay>0){s.fireDelay--;if(s.fireDelay===0&&s.visible&&!player.stillnessActive){fireAt(e,player.x,player.y);eBullets[eBullets.length-1].col='#ff6600';}}
  if(s.visible){
    if(s.teleTimer<=0){
      s.visible=false;e.canBeHit=false;s.teleTimer=30+Math.random()*20;
      s.nextX=80+Math.random()*(W-160);s.nextY=80+Math.random()*(H*0.5); // static will betray this spot
    }
  } else if(s.teleTimer<=0){
    e.x=s.nextX!==undefined?s.nextX:e.x;e.y=s.nextY!==undefined?s.nextY:e.y;
    s.visible=true;e.canBeHit=true;s.fireDelay=10;
    s.teleTimer=64+Math.random()*36;
  }
}
function updateEnemy_decoy(e,s){
  if(s.disguised){
    // Hides among the HUD feathers — gentle bob, then begins creeping toward Laila
    e.canBeHit=false;
    e.y+=Math.sin(frameCount*0.03+s.bobPhase)*0.06;
    if(s.creepTimer>0)s.creepTimer--;
    else{e.x+=(player.x-e.x)*0.0012;e.y+=(player.y-e.y)*0.0012;} // almost imperceptible
    // Proximity reveal — it gets too close and drops the act
    if(Math.abs(e.x-player.x)<46&&Math.abs(e.y-player.y)<52){s.disguised=false;e.canBeHit=true;}
    // Last one standing: nothing left to hide behind — it steps out on its own
    if(enemies.filter(o=>!o.dead).length===1){
      s.soloTimer=(s.soloTimer||0)+1;
      if(s.soloTimer>90){s.disguised=false;e.canBeHit=true;burst(e.x,e.y,'#ccccff',8,2);}
    } else s.soloTimer=0;
  }
  else{e.x+=(player.x-e.x)*0.08+(Math.random()-0.5)*5;e.y+=(player.y-e.y)*0.08+(Math.random()-0.5)*5;e.canBeHit=true;}
}
// The Echo — three chromatic fragments of Laila orbiting a hollow center.
// Kill all three before any reassembles: dead fragments flicker back at 1hp
// after 4 seconds. A kill-order puzzle under time.
function echoCompPos(e,i){
  const s=e.special,a=(s.rot||0)+i*(Math.PI*2/3);
  return {x:e.x+Math.cos(a)*26,y:e.y+Math.sin(a)*20};
}
function updateEnemy_echo(e,s){
  s.rot=(s.rot||0)+0.018;
  e.x+=(player.x-e.x)*0.0035;e.y+=e.spd*0.55;
  s.comps.forEach(c=>{
    if(c.dead){
      c.reTimer=(c.reTimer||240)-1;
      if(c.reTimer<=0){c.dead=false;c.hp=1;c.flicker=30;burst(e.x,e.y,'#cc44cc',6,2);} // it remembers itself
    }
    if(c.flicker>0)c.flicker--;
  });
  e.hp=s.comps.reduce((sum,c)=>sum+(c.dead?0:c.hp),0);if(e.hp<=0)e.dead=true;
}
// The Signal — static broadcaster. Its ring gaps ROTATE with the spinning
// hexagon (watch the body to know where safety is), and every third pulse
// is a twin ring with offset gaps — thread one, then the other.
function updateEnemy_signal(e,s){
  if(s.matTimer>0){s.matTimer--;e.canBeHit=s.matTimer<=0;return;} // materializing — harmless, untouchable
  s.gapRot=(s.gapRot||0)+0.005;
  s.pulseTimer++;
  if(s.pulseTimer>=90){
    s.pulseCount=(s.pulseCount||0)+1;
    s.waves.push({r:0,opacity:0.8,gapOff:s.gapRot});
    if(s.pulseCount%3===0)s.waves.push({r:-30,opacity:0.8,gapOff:s.gapRot+0.52}); // the twin — gaps don't line up
    s.pulseTimer=0;
  }
  s.waves=s.waves.filter(w=>{
    w.r+=2.4;w.opacity-=0.015;
    if(w.r>0&&player.iframes<=0&&w.opacity>0.1){
      const dp=Math.abs(Math.sqrt((player.x-e.x)**2+(player.y-e.y)**2)-w.r);
      if(dp<12){
        const angD=((Math.atan2(player.y-e.y,player.x-e.x)-w.gapOff)*180/Math.PI%360+360)%360;
        const inGap=[0,90,180,270].some(g=>Math.min(Math.abs(angD-g),360-Math.abs(angD-g))<22.5);
        if(!inGap)damagePlayer();
      }
    }
    return w.opacity>0;
  });
  enemies.forEach(oe=>{if(oe===e||oe.type==='signal')return;const sdx=e.x-oe.x,sdy=e.y-oe.y,sd=Math.sqrt(sdx*sdx+sdy*sdy)||1;if(sd<200){oe.x+=sdx/sd*0.35;oe.y+=sdy/sd*0.35;}});
}
// The Root — territorial growth. Anchored to the lake bed, it grows toward
// Laila one telegraphed segment at a time; the TIP is the only weak point,
// and wounding it forces a recoil. Space itself closes in.
function updateEnemy_root(e,s){
  if(!s.segs)s.segs=[{x:e.x,y:e.y}];
  s.growT=(s.growT||0)+1;
  if(s.retract>0){
    s.retract--;
    if(s.segs.length>1&&s.retract%16===0)s.segs.pop(); // recoils, segment by segment
  } else if(s.growT>=46&&s.segs.length<7){
    s.growT=0;
    const tip=s.segs[s.segs.length-1];
    const a=Math.atan2(player.y-tip.y,player.x-tip.x)+(Math.random()-0.5)*0.5;
    s.segs.push({x:Math.max(20,Math.min(W-20,tip.x+Math.cos(a)*46)),y:tip.y+Math.sin(a)*46});
  }
  const nt=s.segs[s.segs.length-1];
  e.x=nt.x;e.y=nt.y; // the entity IS the tip — the only thing bullets can wound
  if(player.iframes<=0)s.segs.forEach(p=>{
    if(Math.abs(p.x-player.x)<26&&Math.abs(p.y-player.y)<26)player.slowTimer=Math.max(player.slowTimer,60);
  });
}
// The Chain — a pendulum hung from the dark above. It pulls back slowly
// (the creak), then sweeps a fast arc through the arena. Its three links can
// only be broken while it hangs or winds up — never mid-sweep.
function updateEnemy_chain(e,s){
  if(s.ax===undefined){
    s.ax=e.x;s.ay=-12;s.ang=(Math.random()<0.5?-1:1)*1.15;
    s.state='hang';s.t=0;s.dir=-Math.sign(s.ang);
    s.links=[2,2,2];s.len=210+Math.random()*60;
  }
  s.t++;
  if(s.state==='hang'){
    s.ang+=Math.sin(frameCount*0.02)*0.0008; // drifts, watching
    if(s.t>50){s.state='windup';s.t=0;}
  } else if(s.state==='windup'){
    s.ang-=s.dir*0.006; // pulls back against the coming sweep — the creak
    if(s.t>=55){s.state='sweep';s.t=0;}
  } else if(s.state==='sweep'){
    s.ang+=s.dir*0.052;
    if(s.ang*s.dir>=1.15){s.ang=s.dir*1.15;s.state='hang';s.t=0;s.dir*=-1;}
  }
  s.ax+=(player.x-s.ax)*0.0012; // the anchor itself creeps after her
  s.pts=[1,2,3].map(k=>({x:s.ax+Math.sin(s.ang)*s.len*k/3,y:s.ay+Math.cos(s.ang)*s.len*k/3}));
  e.x=s.pts[2].x;e.y=s.pts[2].y;
  e.canBeHit=s.state!=='sweep'; // too fast to catch mid-sweep
  if(s.state==='sweep'&&player.iframes<=0&&!player.stillnessActive){
    s.pts.forEach((p,i)=>{if(s.links[i]>0&&Math.abs(p.x-player.x)<20&&Math.abs(p.y-player.y)<24)damagePlayer();});
  }
}
// The Owl Guardian — perched, untouchable, patient. Its eyes IGNITE half a
// second before the swoop; the swoop curves and drags a wind-wake that
// pushes Laila. After two swoops it perches exhausted — wings down, mortal.
function updateEnemy_owlguardian(e,s){
  if(s.exhaust>0){
    s.exhaust--;e.canBeHit=true; // spent — the punish window
    if(s.exhaust<=0){s.perched=true;s.swoops=0;e.canBeHit=false;}
    return;
  }
  if(s.perched){
    e.canBeHit=false;
    const gd=Math.sqrt((player.x-e.x)**2+(player.y-e.y)**2);
    s.patience=(s.patience||0)+1;
    // It strikes when you come close — or when its patience runs out.
    // (Never a statue: camping at range cannot stall the wave.)
    if(!s.flare&&(gd<150||s.patience>300))s.flare=30; // amber eyes flare — it has chosen
    if(s.flare>0){
      s.flare--;
      if(s.flare<=0){s.perched=false;s.patience=0;s.swoopAngle=Math.atan2(player.y-e.y,player.x-e.x);s.swoopProgress=0;e.canBeHit=true;}
    }
  } else {
    s.swoopProgress+=3.5;
    const curve=Math.sin(s.swoopProgress*0.01)*0.5;
    e.x+=Math.cos(s.swoopAngle+curve)*3.6;e.y+=Math.sin(s.swoopAngle+curve)*2.0;
    // wind-wake — the pass itself displaces her
    if(Math.abs(e.x-player.x)<90&&Math.abs(e.y-player.y)<70){
      player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x+Math.cos(s.swoopAngle)*0.55));
    }
    if(s.swoopProgress>300){
      s.swoops=(s.swoops||0)+1;
      e.x=Math.max(60,Math.min(W-60,e.x));e.y=Math.max(80,Math.min(H*0.4,e.y));
      s.swoopProgress=0;
      if(s.swoops>=2)s.exhaust=90; else {s.perched=true;e.canBeHit=false;}
    }
  }
}

function updateEnemyBehavior(e){
  const s=e.special;
  switch(e.type){
    case 'rotwood':     updateEnemy_rotwood(e,s);    break;
    case 'deeplight':   updateEnemy_deeplight(e,s);  break;
    case 'lakemoss':    updateEnemy_lakemoss(e,s);   break;
    case 'hand':        updateEnemy_hand(e,s);       break;
    case 'seeker':      updateEnemy_seeker(e,s);     break;
    case 'handcluster': updateEnemy_handcluster(e,s);break;
    case 'reflection':  updateEnemy_reflection(e,s); break;
    case 'glitch':      updateEnemy_glitch(e,s);     break;
    case 'decoy':       updateEnemy_decoy(e,s);      break;
    case 'echo':        updateEnemy_echo(e,s);       break;
    case 'signal':      updateEnemy_signal(e,s);     break;
    case 'root':        updateEnemy_root(e,s);       break;
    case 'chain':       updateEnemy_chain(e,s);      break;
    case 'owlguardian': updateEnemy_owlguardian(e,s);break;
  }
}

// ── update ─────────────────────────────────────────────────────────────────────
function update() {
  if(paused)return;
  frameCount++;
  if(gameState==='intro'){updateIntro();return;}
  if(gameState!=='playing')return;

  if(cutscene.active){updateCutscene();return;}
  if(zoneTransTimer>0){
    zoneTransTimer--;
    if(zoneTransTimer===45){initZone(currentZone+1);spawnWave();}
    return;
  }

  updateZoneParticles();
  updateBgElements();
  if(currentZone===2) updateBreatheCall();
  if(currentZone===3) updateZ3Events();

  // Player movement
  let spd=player.spd;
  if(player.slowTimer>0){player.slowTimer--;spd*=0.5;}
  if(player.chokeTimer>0){player.chokeTimer--;spd=0;}

  if(player.driftActive){
    player.x+=player.driftVx;player.y+=player.driftVy;
    player.driftTimer--;if(player.driftTimer<=0)player.driftActive=false;
  } else {
    if((keys['a']||keys['ArrowLeft'])&&player.x>player.w/2)player.x-=spd;
    if((keys['d']||keys['ArrowRight'])&&player.x<W-player.w/2)player.x+=spd;
    if((keys['w']||keys['ArrowUp'])&&player.y>player.h/2)player.y-=spd;
    if((keys['s']||keys['ArrowDown'])&&player.y<H-player.h/2)player.y+=spd;
  }
  if(player.driftCD>0)player.driftCD--;
  if(player.hasDrift&&player.driftCD<=0&&!player.driftActive&&(keys['Shift']||keys['q']||keys['Q'])){
    const dx=(keys['d']||keys['ArrowRight'])?1:(keys['a']||keys['ArrowLeft'])?-1:0;
    const dy=(keys['s']||keys['ArrowDown'])?1:(keys['w']||keys['ArrowUp'])?-1:0;
    if(dx||dy){player.driftActive=true;player.driftTimer=14;player.driftCD=90;player.driftVx=dx*5.5;player.driftVy=dy*5.5;}
  }
  if(player.stillnessTimer>0)player.stillnessTimer--;
  if(player.stillnessCD>0)player.stillnessCD--;
  if(player.stillnessActive&&player.stillnessTimer<=0){player.stillnessActive=false;player.stillnessCD=480;}
  if(player.hasStillness&&!player.stillnessActive&&player.stillnessCD<=0&&(keys['e']||keys['E'])){player.stillnessActive=true;player.stillnessTimer=120;}

  // Shooting
  playerFiredThisFrame=false;
  if(player.shootCD>0)player.shootCD--;
  if(player.shootCD<=0){
    playerFiredThisFrame=true;
    const lv=projectileLevel;
    if(lv===2){[-0.5,0,0.5].forEach(vx=>bullets.push({x:player.x,y:player.y-player.h/2,vx,vy:-4.5,level:2,r:4,damage:1}));}
    else if(lv===3){bullets.push({x:player.x,y:player.y-player.h/2,vx:0,vy:-3.5,level:3,r:9,damage:3});}
    else if(lv===1){bullets.push({x:player.x,y:player.y-player.h/2,vx:0,vy:-7,level:1,r:4,damage:1,piercing:true,hitEnemies:[]});}
    else{bullets.push({x:player.x,y:player.y-player.h/2,vx:0,vy:-5,level:0,r:4,damage:1});}
    Aud.sfxFire(lv);
    player.shootCD=player.shootRate;
  }
  if(player.iframes>0)player.iframes--;

  bullets=bullets.filter(b=>{b.x+=b.vx||0;b.y+=b.vy;return b.y>-10&&b.x>-20&&b.x<W+20;});
  eBullets=eBullets.filter(b=>{
    if(b.feather){ // lingering feathers decelerate, then drift down like real ones
      b.age++;b.vx*=0.965;b.vy=b.vy*0.965+0.022;
      b.x+=b.vx+Math.sin(b.age*0.06)*0.4;b.y+=b.vy;
      return b.age<340&&b.y<H+10&&b.x>-10&&b.x<W+10;
    }
    b.x+=b.vx||0;b.y+=b.vy;return b.y<H+10&&b.x>-10&&b.x<W+10;
  });

  updateBoss();
  if(midHand)updateMidHand();

  enemies.forEach(e=>{
    if(e.dead)return;
    updateEnemyBehavior(e);
    e.x=Math.max(e.w/2,Math.min(W-e.w/2,e.x));
    if(e.fireCD>0)e.fireCD--;
  });

  bullets=bullets.filter(b=>{
    let alive=true;
    enemies=enemies.filter(e=>{
      if(e.dead)return false;
      if(!alive&&!b.piercing)return true;
      if(b.piercing&&b.hitEnemies&&b.hitEnemies.includes(e))return true;
      if(!e.canBeHit){
        if(e.type==='decoy'&&e.special.disguised&&hit(b.x,b.y,b.r*2,b.r*2,e.x,e.y,e.w,e.h)){e.special.disguised=false;e.canBeHit=true;alive=false;}
        return true;
      }
      const hcol=getEnemyColor(e);
      if(hit(b.x,b.y,b.r*2,b.r*2,e.x,e.y,e.w,e.h)){
        if(e.type==='echo'){
          // hit the orbiting fragment nearest the bullet
          let bi=-1,bd=9999;
          e.special.comps.forEach((c,i)=>{if(c.dead)return;const p=echoCompPos(e,i);const d=Math.sqrt((b.x-p.x)**2+(b.y-p.y)**2);if(d<bd){bd=d;bi=i;}});
          if(bi>=0&&bd<30){
            const c=e.special.comps[bi];c.hp--;
            if(c.hp<=0){c.dead=true;c.reTimer=240;const p=echoCompPos(e,bi);burst(p.x,p.y,['#ff4444','#44ff44','#4444ff'][bi],8,3);}
          }
          e.hp=e.special.comps.reduce((s,c)=>s+(c.dead?0:c.hp),0);
        } else if(e.type==='chain'){
          // break the nearest living link — only while it hangs or winds up
          const s2=e.special;
          if(s2.pts&&s2.links){
            let bi=-1,bd=9999;
            s2.pts.forEach((p,i)=>{if(s2.links[i]<=0)return;const d=Math.sqrt((b.x-p.x)**2+(b.y-p.y)**2);if(d<bd){bd=d;bi=i;}});
            if(bi>=0&&bd<26){s2.links[bi]--;e.hp--;if(s2.links[bi]<=0)burst(s2.pts[bi].x,s2.pts[bi].y,'#2a2535',12,3);}
          } else e.hp--;
          burst(b.x,b.y,hcol,6,3);
        } else {
          burst(b.x,b.y,hcol,6,3);e.hp-=(b.damage||1);
          if(e.type==='root')e.special.retract=36; // the vine recoils when wounded
        }
        Aud.sfxHit(currentZone);
        if(b.piercing&&b.hitEnemies)b.hitEnemies.push(e);else alive=false;
        if(e.hp<=0){
          score+=e.score;burst(e.x,e.y,hcol,18);
          Aud.sfxKill(currentZone);
          // Reflection: respawns once before dying for real
          if(e.type==='reflection'&&e.special.respawnsLeft>0){e.special.respawnsLeft--;e.hp=e.maxHp;e.special.respawnTimer=300;return true;}
          // Seeker: release 3 hand-burst projectiles on death
          if(e.type==='seeker'){for(let si=0;si<3;si++){const sa=Math.atan2(player.y-e.y,player.x-e.x)+(si-1)*0.4;eBullets.push({x:e.x,y:e.y,vx:Math.cos(sa)*1.8,vy:Math.sin(sa)*1.8,col:'#ffaa20',r:4});}}
          maybeDropPowerup(e.x,e.y);if(currentZone===3)spawnGeoFlash(e.x,e.y);e.dead=true;return false;
        }
      }return true;
    });
    return alive;
  });

  // Mid-hand bullet collision (exposed phase only)
  if(midHand&&midHand.phase==='exposed'){
    const m=midHand;
    bullets=bullets.filter(b=>{
      if(m.hp<=0)return true;
      if(!hit(b.x,b.y,b.r*2,b.r*2,m.x,m.y-200,160,200))return true;
      burst(b.x,b.y,'#ff4400',8,3);m.flashTimer=8;m.hp-=(b.damage||1);
      if(m.hp<=0)killMidHand();
      return b.piercing||false;
    });
  }

  if(player.iframes<=0&&!player.stillnessActive){
    enemies.forEach(e=>{
      if(e.dead||!e.canBeHit)return;
      if(['lakemoss','handcluster','signal','root','chain'].includes(e.type))return; // these damage on their own terms
      if(e.type==='decoy'&&e.special.disguised)return;
      if(hit(player.x,player.y,player.w,player.h,e.x,e.y,e.w,e.h))damagePlayer();
    });
    eBullets=eBullets.filter(b=>{
      if(hit(b.x,b.y,b.r*2,b.r*2,player.x,player.y,player.w+6,player.h+6)){damagePlayer();burst(b.x,b.y,'#ff4466',8,3);return false;}
      return true;
    });
  }

  drops=drops.filter(d=>{
    d.y+=0.6;
    if(hit(d.x,d.y,20,20,player.x,player.y,player.w+12,player.h+12)){collectDrop(d.kind);burst(player.x,player.y,'#fff',10,3);return false;}
    return d.y<H+20;
  });

  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life-=p.decay;return p.life>0;});
  enemies=enemies.filter(e=>!e.dead&&e.y<H+100);

  // Wave/boss progression
  if(enemies.length===0&&!boss&&!midHand&&zoneTransTimer===0){
    if(bossSpawnTimer>0){bossSpawnTimer--;if(bossSpawnTimer===0)spawnZoneBoss();}
    else{
      waveDelay--;
      if(waveDelay<=0){
        if(zoneWave>=ZONE_WAVE_COUNTS[currentZone]){
          if(currentZone===4){startCutscene('unchaining');waveDelay=9999;}
          else{
            bossSpawnTimer=120;waveDelay=9999;
            if(currentZone===3){screenFlipped=true;screenFlipTimer=110;}
          }
        }
        else if(currentZone===2&&zoneWave===2&&!midHandDone){triggerMidHand();}
        else{waveDelay=ZONE_WAVE_DELAYS[currentZone];spawnWave();}
      }
    }
  }
}

function fireAt(e,tx,ty){const dx=tx-e.x,dy=ty-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1,spd=currentZone>=3?1.8:1.5;eBullets.push({x:e.x,y:e.y,vx:(dx/dist)*spd,vy:(dy/dist)*spd,col:COL.eBullet,r:3.5});}
function damagePlayer(){if(player.iframes>0)return;if(debugMode){player.iframes=40;return;}player.hp--;player.iframes=100;burst(player.x,player.y,COL.accent,22);Aud.sfxPlayerHit();if(player.hp<=0){Aud.onDeath();gameState='gameover';hi=Math.max(hi,score);runCount++;dreamFragmentLevel=Math.min(8,dreamFragmentLevel+1);localStorage.setItem('lailaRuns',runCount);localStorage.setItem('lailaDreams',dreamFragmentLevel);}}
function maybeDropPowerup(x,y){
  if(currentZone===4)return;
  if(currentZone===1){if(Math.random()<0.04)drops.push({x,y,kind:'heal'});return;}
  const r=Math.random();
  if(r<0.05)drops.push({x,y,kind:'heal'});
  else if(r<0.12&&!player.hasDrift)drops.push({x,y,kind:'drift'});
  else if(r<0.17&&projectileLevel<3)drops.push({x,y,kind:'upgrade'}); // bosses now guarantee stages — drops accelerate, not carry
  else if(r<0.25&&player.shootRate>18)drops.push({x,y,kind:'firerate'});
}
function collectDrop(kind){
  if(kind==='heal')player.hp=Math.min(player.hp+1,player.maxHp);
  if(kind==='upgrade')projectileLevel=Math.min(projectileLevel+1,3);
  if(kind==='drift')player.hasDrift=true;
  if(kind==='stillness')player.hasStillness=true;
  if(kind==='firerate')player.shootRate=Math.max(18,player.shootRate-9);
}

// ── draw helpers ───────────────────────────────────────────────────────────────
function glow(col,blur=12){ctx.shadowColor=col;ctx.shadowBlur=blur;}
function noGlow(){ctx.shadowBlur=0;}

// ── intro update ───────────────────────────────────────────────────────────────
function updateIntro(){
  if(introPhase>0)zoneParticles.forEach(p=>{p.y+=p.spd;if(p.y>H+6){p.y=-6;p.x=Math.random()*W;}});
  introTimer++;
  const dur=INTRO_PHASES[introPhase].dur;
  if(introTimer>=dur&&introPhase<INTRO_PHASES.length-1){introPhase++;introTimer=0;}
  if(introPhase!==introPrevPhase){introPrevPhase=introPhase;Aud.introPhaseSound(INTRO_PHASES[introPhase].name);}
}
function pAlpha(t,dur,fl=22){if(dur>=99999)return 1;return Math.min(Math.min(1,t/fl),Math.min(1,(dur-t)/fl));}
function drawAscii(lines,cx,cy,col,size=13,lh=19,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.font=`${size}px monospace`;ctx.fillStyle=col;ctx.textAlign='center';const th=lines.length*lh;lines.forEach((l,i)=>ctx.fillText(l,cx,cy-th/2+i*lh+lh));ctx.restore();}
function drawSmallFeather(x,y,alpha,col='#ffffff',scale=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.strokeStyle=col;ctx.lineWidth=1.4*scale;ctx.lineCap='round';glow(col,8);const r=12*scale;ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(r*0.7,0,0,r);ctx.quadraticCurveTo(-r*0.7,0,0,-r);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();noGlow();ctx.restore();ctx.globalAlpha=1;}

// ── cutscene system ────────────────────────────────────────────────────────────
// Phase durations per cutscene type
const CS_PHASES={
  drowning:      [159,134,116,116,131,190],   // fade,arms,limp,dark water,black,hold
  transition_z3: [45,299,45],                  // fade out,hold+title,fade in
  transition_z4: [45,392,45],
  unchaining:    [80,240,209,40,134,131,147,320,147,299], // dissolve,descend,shadow visible,reach,chain×3,eyes,beat,rise
  true_ending:   [900,200,480,720,360,1200,360,9999], // camera-follow ascent+transform, burst, sky+owl, owl→moon, tilt, feather 20s, THE END
};
// Editable script lines — modified live by cutscene-editor.html
const csText={
  z3Title:       '/ Laila peeks behind the curtain /',
  z4Title:       '/ At the bottom of the lake, someone\'s trapped /',
  unchainSilence:'It\'s you. ',
  breatheWord:   'Breathe.',
};

function updateCutscene(){
  const cs=cutscene;
  cs.timer++;
  const phases=CS_PHASES[cs.type];
  if(cs.phase<phases.length-1&&cs.timer>=phases[cs.phase]){cs.phase++;cs.timer=0;onCutscenePhase(cs.type,cs.phase);}
  else if(cs.phase===phases.length-1&&cs.timer>=phases[cs.phase]){completeCutscene();}
}

function onCutscenePhase(type,phase){
  if(type==='drowning'&&phase===5){
    // Advance to Zone 2 at the black hold
    initZone(2);spawnWave();cutscene.lailaY=player.y;
  }
  if(type==='transition_z3'&&phase===2){initZone(3);spawnWave();}
  if(type==='transition_z4'&&phase===2){initZone(4);spawnWave();}
  if(type==='unchaining'&&phase===9){
    // Spawn Shadow boss after rise phase
    cutscene.active=false;
    boss=null;spawnZoneBoss();
  }
  if(type==='true_ending'){Aud.tePhaseSound(phase);}
  if(type==='true_ending'&&phase===4){Aud.victory();}   // camera tilt = victory music
  if(type==='true_ending'&&phase===7){gameState='victory';}
}

function completeCutscene(){
  cutscene.active=false;
}

function drawCutscene(){
  const cs=cutscene,t=cs.timer;
  drawBackground();// zone bg always behind cutscene
  updateZoneParticles();

  if(cs.type==='drowning')        drawCS_drowning(t);
  else if(cs.type==='transition_z3') drawCS_transition(t,csText.z3Title,cs.phase,'fist');
  else if(cs.type==='transition_z4') drawCS_transition(t,csText.z4Title,cs.phase,'face');
  else if(cs.type==='unchaining') drawCS_unchaining(t);
  else if(cs.type==='true_ending')drawCS_trueEnding(t);
}

function drawCS_drowning(t){
  const cs=cutscene,ph=cs.phase;
  const lx=player.x, ly=cs.lailaY;

  if(ph===0){
    // Enemies fade, Laila slows — normal scene still visible
    const a=Math.min(1,t/40)*0.3;
    ctx.fillStyle=`rgba(5,10,20,${a})`;ctx.fillRect(0,0,W,H);
  } else if(ph===1){
    // Arms lower, light above dims
    cs.lailaAngle=Math.min(0.15,cs.lailaAngle+0.003);
    cs.lailaY=Math.min(cs.lailaY+0.4,H-40);
    ctx.fillStyle='rgba(5,10,20,0.45)';ctx.fillRect(0,0,W,H);
  } else if(ph===2){
    // Limp — head drops, rotation increases
    cs.lailaAngle=Math.min(0.35,cs.lailaAngle+0.005);
    cs.lailaY+=0.2;
    ctx.fillStyle='rgba(2,4,10,0.7)';ctx.fillRect(0,0,W,H);
  } else if(ph===3){
    // Dark water — stick debris drifts past
    cs.lailaY+=0.12;
    ctx.fillStyle='rgba(2,4,12,0.88)';ctx.fillRect(0,0,W,H);
    // Debris strips
    ctx.strokeStyle='rgba(30,18,8,0.55)';ctx.lineWidth=1.2;ctx.lineCap='round';
    bgElements.forEach(el=>{
      if(el.type==='stick'){ctx.save();ctx.globalAlpha=el.opacity*0.6;ctx.translate(el.x,el.y);ctx.rotate(el.angle);ctx.beginPath();ctx.moveTo(-el.len/2,0);ctx.lineTo(el.len/2,0);ctx.stroke();ctx.restore();}
    });
  } else if(ph>=4){
    // Fade to black
    const a=ph===4?Math.min(1,t/50):1;
    ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);
  }

  // Draw Laila in drowning pose
  if(ph<=3){
    const sinkAlpha=ph>=2?Math.max(0,1-t/60):1;
    ctx.save();ctx.globalAlpha=sinkAlpha;ctx.translate(lx,cs.lailaY);ctx.rotate(cs.lailaAngle);
    drawPlayerAt(0,0,ph>=2);// limp=true from phase 2
    ctx.restore();
    // Water bubbles rising past her
    if(ph>=1){
      const bt=(t*0.8+cs.phase*30)%100;
      ctx.globalAlpha=0.3;ctx.fillStyle='#8ab0cc';
      ctx.beginPath();ctx.arc(lx-20,cs.lailaY-bt,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(lx+15,cs.lailaY-bt*0.7,1,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}

function drawCS_transition(t,title,ph,fragKind){
  if(ph===0){
    const a=Math.min(1,t/40);ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);
  } else if(ph===1){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    // Dream fragment — impressionistic image based on which transition
    const df=Math.min(1,t/12)*Math.min(1,(35-t)/10);
    if(df>0&&dreamFragmentLevel>0){
      const dfA=df*Math.min(1,dreamFragmentLevel/3)*0.4;
      ctx.save();ctx.globalAlpha=dfA;
      if(fragKind==='fist'){
        // Zone 2→3: a fist closing — oval shapes
        ctx.strokeStyle='#662200';ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(W/2,H/2,50,38,0,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.ellipse(W/2,H/2+30,48,14,0,0,Math.PI);ctx.stroke();
        for(let f=0;f<4;f++){ctx.beginPath();ctx.ellipse(W/2-30+f*18,H/2-28,8,18,0,0,Math.PI*2);ctx.stroke();}
      } else {
        // Zone 3→4: static noise resolving into a face outline
        for(let s=0;s<120;s++){ctx.fillStyle='#333';ctx.fillRect(W/2-60+Math.random()*120,H/2-50+Math.random()*100,2,2);}
        ctx.strokeStyle='#444';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(W/2,H/2,40,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.arc(W/2-14,H/2-8,5,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.arc(W/2+14,H/2-8,5,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.arc(W/2,H/2+16,12,0.1,Math.PI-0.1);ctx.stroke();
      }
      ctx.restore();
    }
    // Zone title text — glitching
    const fa=Math.min(1,t/18)*Math.min(1,(35-t)/12);
    ctx.globalAlpha=fa*0.6;
    const shift=Math.random()>0.7?Math.floor(Math.random()*4)-2:0;
    ctx.fillStyle='#ffffff';ctx.font='bold 15px monospace';ctx.textAlign='center';
    ctx.fillText(title,W/2+shift,H/2+70);
    ctx.globalAlpha=1;
  } else if(ph===2){
    const a=1-Math.min(1,t/40);ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);
  }
}

function drawCS_unchaining(t){
  const cs=cutscene,ph=cs.phase;
  // Zone 4 background is always showing
  // Shadow position: starts at very bottom, rises as phases progress
  cs.shadowY=Math.max(H*0.72-ph*14,H*0.4);

  if(ph===0){
    // Dissolve enemies — already cleared in startCutscene
    // Laila drifts toward center
    const cx=W/2,cy=H*0.45;
    player.x+=(cx-player.x)*0.04;player.y+=(cy-player.y)*0.04;
    drawPlayer();
    ctx.fillStyle=`rgba(0,0,0,${Math.min(0.4,t/80*0.4)})`;ctx.fillRect(0,0,W,H);
  } else if(ph>=1&&ph<=2){
    // Laila at center, shadow becomes visible at bottom
    drawPlayer();
    const shadowAlpha=Math.min(0.6,(ph-1+t/60)*0.3);
    drawShadowChained(W/2,cs.shadowY,shadowAlpha,true);
  } else if(ph===3){
    // Laila descends toward shadow
    player.y=Math.min(player.y+1.5,cs.shadowY-80);
    drawPlayer();drawShadowChained(W/2,cs.shadowY,0.6,true);
  } else if(ph>=4&&ph<=6){
    // Chains fall one by one
    const chainFall=ph-4;
    if(cs.chainsDone<chainFall+1&&t<10){cs.chainsDone=chainFall+1;burst(W/2,cs.shadowY,'#2a2535',12,3);}
    drawPlayer();drawShadowChained(W/2,cs.shadowY,0.7,false,cs.chainsDone);
  } else if(ph===7){
    // Shadow's eyes open
    drawPlayer();drawShadowChained(W/2,cs.shadowY,0.75,false,3,Math.min(1,t/50));
    // Brief text
    if(t>40){ctx.globalAlpha=Math.min(1,(t-40)/20)*0.35;ctx.fillStyle='#ffffff';ctx.font='italic 14px monospace';ctx.textAlign='center';ctx.fillText(csText.unchainSilence,W/2,cs.shadowY-90);ctx.globalAlpha=1;}
  } else if(ph===8){
    // Long beat
    drawPlayer();drawShadowChained(W/2,cs.shadowY,0.8,false,3,1);
  } else if(ph===9){
    // Shadow rises toward player
    cs.shadowY=Math.max(cs.shadowY-1.8,player.y+80);
    drawPlayer();drawShadowChained(W/2,cs.shadowY,0.85,false,3,1);
  }
}

function drawShadowChained(sx,sy,alpha,chained,chainsDone=0,eyeAlpha=0){
  // Full Laila sprite — Zone 4 shadow palette, green eyes revealed progressively
  drawLailaVariant(sx, sy, {
    floatOff: 2.8,
    mirror:   true,
    alpha,
    hairCol:  '#1a0a06',
    dressCol: '#040e06',
    skinCol:  '#0a1208',
    eyeCol:   '#00cc66',          // green eyes — her true self underneath
    eyeGlow:  '#004422',
    eyeOverrideAlpha: eyeAlpha,   // 0 until unchaining cutscene reveals them
    l1Mod: ([px,py],i) =>         // hair pushed outward + slightly upward — angular, tense
      ([2,3,7,8].includes(i)) ? [px*1.12, py-3] : [px,py]
  });
  // Chains (3 max, falling away one by one)
  if(chained||(chainsDone<3)){
    const remaining=chained?3:3-chainsDone;
    ctx.strokeStyle='rgba(42,37,53,0.8)';ctx.lineWidth=2;ctx.setLineDash([5,4]);
    for(let c=0;c<remaining;c++){
      const cx2=sx-30+c*30,cy2=sy+20;
      ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(cx2,cy2+60+c*20);ctx.stroke();
    }
    ctx.setLineDash([]);
  }
}

function drawStars(alpha){
  if(alpha<=0)return;
  const sd=[[68,48],[175,28],[308,66],[442,38],[522,88],[92,112],[385,102],[506,62],[138,158],[282,42],[418,118],[48,142],[252,78],[488,152],[162,52],[348,128],[205,140],[330,30],[460,108]];
  sd.forEach(([sx,sy],i)=>{
    ctx.globalAlpha=alpha*(0.32+0.28*Math.sin(frameCount*0.022+i*0.85));
    ctx.fillStyle='#cce0ff';ctx.font=`${9+i%3}px monospace`;ctx.textAlign='center';
    ctx.fillText(['·','*','.','·','°'][i%5],sx,sy);
  });
  ctx.globalAlpha=1;
}

// ── true-ending cinematic helpers (module-level) ───────────────────────────────
function teEaseOut(v){return 1-Math.pow(1-Math.min(v,1),2);}
function teUwBubbles(alpha){
  const bc=['o','°','·','○','◦'];
  for(let i=0;i<22;i++){
    const bx=28+((i*131)%(W-56));
    const by=H-((frameCount*0.95+i*73)%(H+30));
    ctx.globalAlpha=alpha*(0.18+0.12*Math.sin(i*1.8+frameCount*0.06));
    ctx.fillStyle='#7ab8cc';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(bc[i%5],bx,by);
  }ctx.globalAlpha=1;
}
function teWaveLine(y,alpha,col='#3a7a99'){
  const sh=Math.sin(frameCount*0.038)*5;
  ctx.globalAlpha=alpha;ctx.fillStyle=col;ctx.font='13px monospace';ctx.textAlign='center';
  ctx.fillText('~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~≈~',W/2+sh,y);

  ctx.globalAlpha=1;
}
function teDrawMoon(cx,cy,r,alpha){
  if(alpha<=0||r<=0)return;
  // Soft halo behind an ASCII crescent — the moon stays in the medium
  ctx.save();
  const mg=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.6);
  mg.addColorStop(0,`rgba(255,251,224,${0.30*alpha})`);mg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mg;ctx.fillRect(cx-r*2.6,cy-r*2.6,r*5.2,r*5.2);
  ctx.restore();
  const ms=Math.max(4,r*0.42);
  drawAsciiC(MOON_ASCII,['#fffbe0'],cx,cy,ms,Math.round(ms*1.15),alpha,'#fffbe0',14*alpha);
}
function teDrawMountains(yBase,alpha){
  if(alpha<=0)return;
  drawAsciiC(MTN_ASCII,['#0e0a22'],W/2,yBase-24,13,15,alpha*0.9);
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#06040f';ctx.fillRect(0,yBase+8,W,Math.max(0,H-yBase-8));ctx.restore();
}

// ── per-phase true-ending draw functions ───────────────────────────────────────
function drawTE_p0(t){ // 900f: camera follows Laila up through the lake
  const sp=t/900,scroll=teEaseOut(sp);
  const r0=Math.floor(scroll*10),g0=Math.floor(scroll*22),b0=Math.floor(2+scroll*30);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,`rgb(${r0},${g0},${b0+12})`);bg.addColorStop(1,`rgb(${r0},${g0},${b0})`);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(surfaceScreenY<H-20){
    const lg=ctx.createLinearGradient(0,surfaceScreenY-90,0,surfaceScreenY+30);
    lg.addColorStop(0,`rgba(55,110,180,${Math.min(0.35,scroll*0.8)})`);lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
    teWaveLine(surfaceScreenY,Math.min(0.75,(scroll-0.55)*3.5));
  }
  drawAsciiField(0.30+scroll*0.25,t,90,'#2a4a77',1.1); // water rushing past as she rises
  const charY=H*0.58;
  if(sp<0.42){
    drawAsciiC(LAILA_RISE,LAILA_RISE_COLS,W/2,charY,11,13,Math.min(1,t/40),'#e0c890',8);
    const ta=Math.min(1,(t-80)/35)*Math.min(1,(820-t)/60)*0.28;
    if(t>80&&t<820){ctx.globalAlpha=ta;ctx.fillStyle='#2255aa';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText('she is rising',W/2,H-45);ctx.globalAlpha=1;}
  } else if(sp<0.72){
    if(t===378)Aud.teTransform();
    const tp=(sp-0.42)/0.30;
    // Laila dissolves into light as the owl takes shape around her
    const lailaA=Math.max(0,1-tp*1.4);
    if(lailaA>0)drawAsciiC(LAILA_RISE,LAILA_RISE_COLS,W/2,charY,11,13,lailaA,'#ffffff',12*(1-lailaA)+8);
    if(tp>0.08){
      const oA=Math.min(1,tp/0.3)*0.92;
      const oS=7+tp*5; // the owl grows into being
      const wing=OWL_WINGS[Math.floor(frameCount/9)%2];
      drawAsciiC(wing,['#ffffff'],W/2,charY-4,oS,Math.round(oS*1.35),oA,'#ffffff',16*Math.min(1,tp/0.3));
    }
    const ta2=Math.min(1,(sp-0.55)/0.10)*Math.min(1,(0.68-sp)/0.04)*0.32;
    if(sp>0.55&&sp<0.68){ctx.globalAlpha=ta2;ctx.fillStyle='#88ccff';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText('she is becoming',W/2,H-45);ctx.globalAlpha=1;}
  } else {
    const wing=OWL_WINGS[Math.floor(frameCount/7)%2];
    drawAsciiC(wing,['#ffffff'],W/2,charY,12,16,1,'#ffffff',14+8*Math.sin(t*0.1));
  }
}

// (old phase bodies live above as drawTE_p0…p7 — kept for reference)
function _crPath(pts,ox,oy){
  const n=pts.length,a=1/6;
  ctx.moveTo((ox||0)+pts[0][0],(oy||0)+pts[0][1]);
  for(let i=0;i<n-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
    ctx.bezierCurveTo((ox||0)+p1[0]+a*(p2[0]-p0[0]),(oy||0)+p1[1]+a*(p2[1]-p0[1]),
                      (ox||0)+p2[0]-a*(p3[0]-p1[0]),(oy||0)+p2[1]-a*(p3[1]-p1[1]),
                      (ox||0)+p2[0],(oy||0)+p2[1]);
  }
}

function updateBreatheCall(){
  if(currentZone!==2)return;
  breatheCallTimer++;

  const thresholds=[700,1600,2600,3700];
